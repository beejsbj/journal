name: web

# The web app (web/) is built here, never on the host that runs the journal. The committed copy of the build
# (src/journal/serve/static) must be exactly what this workflow produces; the build is uploaded as an artifact on
# every run, which is how a new copy is made: download it and commit it over src/journal/serve/static.
on:
  push:
    paths:
      - "web/**"
      - "src/journal/serve/static/**"
      - "tests/fixtures/api/**"
      - "tools/serve_fixture.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/journal/serve/static/**"
      - "tests/fixtures/api/**"
      - "tools/serve_fixture.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static
          path: src/journal/serve/static
          if-no-files-found: ignore
      - name: The committed build is this build
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- src/journal/serve/static)" ]; then
            git status --short -- src/journal/serve/static
            echo "::error::src/journal/serve/static differs from a fresh build of web/. Download the 'static' artifact of this run and commit it."
            exit 1
          fi

  smoke:
    # Playwright against the real server over a temporary journal (tools/serve_fixture.py), on the committed build.
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: web/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
          if-no-files-found: ignore

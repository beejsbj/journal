<style id="tokens">
/* =====================================================================
   journal · design tokens, round 02 (Folio × Night Room)
   One sheet. Lift this block into web/src/tokens.css as it stands.
   Roles, not colours: components read --room/--pane/--text…, never a hex.
   Light = Folio's warm paper on a desk. Dark = Night Room's cool room.
   Her ink (--her) is the only hue; it is registered so a new ink flows.
   ===================================================================== */
@property --her { syntax: '<color>'; inherits: true; initial-value: #28367f; }

:root {
  /* ---- type: three families, one job each ---- */
  --f-his: "Newsreader", "Iowan Old Style", Charter, Georgia, serif;          /* his words; the book's titles, italic heads, hours */
  --f-her: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;        /* her words, and only hers: typed letters */
  --f-ui:  "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; /* the interface */

  /* ---- type scale (rem at 16) ---- */
  --t-micro: 0.75rem;     /* 12  margin source, counts, calendar heads */
  --t-small: 0.8125rem;   /* 13  meta, hints, labels about her */
  --t-ui: 0.9375rem;      /* 15  interface body, nav, rows */
  --t-her: 0.9063rem;     /* 14.5 her letters and notes */
  --t-her-lg: 1.0625rem;  /* 17  the question she asked */
  --t-read: 1.25rem;      /* 20  his words, reading */
  --t-write: 1.5rem;      /* 24  his words, writing (you write larger than you read) */
  --t-h3: 1.25rem;        /* 20  book heads, italic */
  --t-h2: 1.75rem;        /* 28  section titles (settings) */
  --t-h1: 2.75rem;        /* 44  page titles */
  --t-display: 4rem;      /* 64  settings title, insights week */
  --t-numeral: 5.5rem;    /* 88  Almanac's large numerals */
  --lh-read: 1.62; --lh-her: 1.72; --lh-write: 1.66; --lh-ui: 1.5;

  /* ---- space (4 px base) and layout measures ---- */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;
  --tap: 44px;
  --gutter: 56px;          /* page padding, desktop (20 on a phone) */
  --measure: 35rem;        /* his column */
  --margin-l: 72px;        /* the hours */
  --margin-r: 200px;       /* her notes */
  --rail: 228px; --rail-compact: 68px;
  --side-list: 280px; --side-rail: 92px;

  /* ---- radius ---- */
  --r-xs: 6px; --r-s: 8px; --r-m: 12px; --r-l: 18px; --r-xl: 26px; --r-pill: 999px;

  /* ---- motion ---- */
  --d-1: 120ms;   /* press, hover */
  --d-2: 200ms;   /* colour, small fades */
  --d-3: 340ms;   /* chevrons, knobs */
  --d-4: 480ms;   /* push, recede */
  --d-bloom: 640ms; /* the write room opening */
  --d-ink: 700ms; /* her ink flowing to a new colour */
  --stagger: 28ms;
  --e-out: cubic-bezier(.16, 1, .3, 1);        /* arrivals */
  --e-inout: cubic-bezier(.65, 0, .35, 1);     /* both ends matter */
  --e-paper: cubic-bezier(.3, .75, .12, 1);    /* anything paper */
  /* damped springs baked to linear(): k260 c27 (controls) and k170 c21 (panes, disclosures) */
  --spring: linear(0, 0.031, 0.107, 0.207, 0.316, 0.426, 0.529, 0.622, 0.703, 0.772, 0.829, 0.875, 0.912, 0.94, 0.962, 0.978, 0.99, 0.997, 1.003, 1.006, 1.007, 1.008, 1.008, 1.008, 1.007, 1.006, 1.005, 1.004, 1.003, 1.003, 1.002, 1.002, 1);
  --spring-dur: 533ms;
  --spring-soft: linear(0, 0.03, 0.103, 0.201, 0.309, 0.419, 0.523, 0.618, 0.701, 0.773, 0.832, 0.88, 0.919, 0.948, 0.971, 0.987, 0.998, 1.006, 1.011, 1.013, 1.014, 1.014, 1.013, 1.012, 1.01, 1.009, 1.007, 1.006, 1.004, 1.003, 1.003, 1.002, 1);
  --spring-soft-dur: 642ms;
}

/* ---- colour roles · light: Folio's paper and desk ---- */
:root, [data-theme="light"] {
  --room: #eee7d9;        /* the desk: behind the panes, the rail */
  --pane: #fbf8f1;        /* the page */
  --raised: #f5f0e5;      /* hover, the player, cards on the page */
  --raised-2: #efe8da;
  --sunk: #ece5d6;        /* inset fields, segmented tracks */
  --letter: #fffcf6;      /* the base of her letters */
  --write-room: #fbf8f1;  /* the writing room's ground */
  --text: #1d1a15;        /* his words, his actions */
  --text-2: #4c443a;
  --text-3: #6d6356;      /* >= 4.5:1 on every light ground, the desk included */
  --hair: #e9e2d3;        /* rules */
  --hair-2: #dcd2bf;      /* outlines, stronger rules */
  --lamp: #1d1a15;        /* his primary action: ink on paper by day */
  --on-lamp: #fbf8f1;
  --nav-on: var(--pane);
  --frost: rgb(251 248 241 / .84);
  --scrim: rgb(40 30 15 / .24);
  --tape: rgb(236 222 190 / .78);
  /* glow: warm lamp light on paper */
  --glow: rgb(255 204 128 / .30);       /* at the head of a page */
  --glow-room: rgb(255 198 120 / .30);  /* behind the writing column */
  --glow-desk: rgb(255 214 150 / .22);  /* the desk, top left */
  --ink-glow-k: 0%;
  --recede: .94; --focus-dim: .3;
  --elev-tab: 0 1px 0 rgb(70 50 20 / .04), 0 1px 3px rgb(70 50 20 / .08);
  --elev-1: 0 0 0 1px rgb(70 50 20 / .05), 0 1px 2px rgb(70 50 20 / .05), 0 16px 48px -16px rgb(70 50 20 / .20);
  --elev-2: 0 0 0 1px rgb(70 50 20 / .05), 0 2px 4px rgb(70 50 20 / .05), 0 30px 64px -24px rgb(70 50 20 / .30);
  --elev-pop: 0 0 0 1px rgb(70 50 20 / .07), 0 4px 10px rgb(40 30 10 / .07), 0 22px 54px -10px rgb(40 30 10 / .26);
  --elev-letter: 0 1px 2px rgb(70 50 20 / .05), 0 10px 26px -16px rgb(70 50 20 / .28);
  color-scheme: light;
}
/* ---- colour roles · dark: Night Room ---- */
[data-theme="dark"] {
  --room: #0a0d12;
  --pane: #141921;
  --raised: #1a2029;
  --raised-2: #222935;
  --sunk: #0f131a;
  --letter: #1a2029;
  --write-room: #0a0d12;
  --text: #ebe8e1;        /* warm paper-white */
  --text-2: #a9afba;
  --text-3: #8a91a0;      /* >= 4.8:1 on every dark ground, glow included */
  --hair: rgb(196 210 235 / .075);
  --hair-2: rgb(196 210 235 / .13);
  --lamp: #f1ede4;        /* his primary action: the lamp */
  --on-lamp: #12161d;
  --nav-on: var(--raised);
  --frost: rgb(20 25 33 / .74);
  --scrim: rgb(5 7 10 / .55);
  --tape: rgb(200 212 235 / .13);
  --glow: rgb(255 238 206 / .055);
  --glow-room: rgb(255 238 206 / .075);
  --glow-desk: rgb(160 180 230 / .045);
  --ink-glow-k: 38%;
  --recede: .7; --focus-dim: .22;
  --elev-tab: inset 0 1px 0 rgb(255 255 255 / .03);
  --elev-1: inset 0 1px 0 rgb(255 255 255 / .035), 0 12px 32px -16px rgb(0 0 0 / .7);
  --elev-2: inset 0 1px 0 rgb(255 255 255 / .045), 0 30px 70px -24px rgb(0 0 0 / .8), 0 2px 10px rgb(0 0 0 / .35);
  --elev-pop: inset 0 1px 0 rgb(255 255 255 / .06), 0 20px 50px -12px rgb(0 0 0 / .75), 0 0 0 1px var(--hair-2);
  --elev-letter: inset 0 1px 0 rgb(255 255 255 / .04), 0 14px 30px -18px rgb(0 0 0 / .8);
  color-scheme: dark;
}

/* ---- her four inks (Folio's set). Light on paper, dark on the night pane; all AA (>= 7:1 body) ---- */
[data-ink="blue-black"] { --her: #28367f; }
[data-ink="brown"]      { --her: #7a4519; }
[data-ink="violet"]     { --her: #4b2a8a; }
[data-ink="green"]      { --her: #1b5642; }
[data-theme="dark"][data-ink="blue-black"], [data-theme="dark"] [data-ink="blue-black"] { --her: #b6c0ff; }
[data-theme="dark"][data-ink="brown"],      [data-theme="dark"] [data-ink="brown"]      { --her: #dcab78; }
[data-theme="dark"][data-ink="violet"],     [data-theme="dark"] [data-ink="violet"]     { --her: #d2b4ff; }
[data-theme="dark"][data-ink="green"],      [data-theme="dark"] [data-ink="green"]      { --her: #8fd3b4; }
/* derived from her ink (recomputed wherever data-ink is set) */
:root, [data-ink] {
  --her-soft: color-mix(in oklab, var(--her) 82%, var(--pane));      /* her labels and times (>= 4.8:1) */
  --her-edge: color-mix(in oklab, var(--her) 34%, var(--pane));      /* the dashed fold, rules in her letters */
  --her-line: color-mix(in oklab, var(--her) 50%, transparent);      /* note rules, question dashes */
  --her-hair: color-mix(in srgb, var(--her) 10%, transparent);       /* the letter's edge */
  --her-wash: color-mix(in srgb, var(--her) 3%, var(--letter));      /* her letter's ground */
  --her-wash-2: color-mix(in srgb, var(--her) 8%, var(--letter));
  --her-glow: color-mix(in oklab, var(--her) var(--ink-glow-k), transparent); /* a halo at night, none by day */
}
html { transition: --her var(--d-ink) var(--e-inout); }

/* ---- reduced motion, and the prototype's motion=off ---- */
@media (prefers-reduced-motion: reduce) {
  :root { --d-1: 1ms; --d-2: 1ms; --d-3: 1ms; --d-4: 1ms; --d-bloom: 1ms; --d-ink: 1ms; --spring-dur: 1ms; --spring-soft-dur: 1ms; --stagger: 0ms; }
}
[data-motion="off"] { --d-1: 1ms; --d-2: 1ms; --d-3: 1ms; --d-4: 1ms; --d-bloom: 1ms; --d-ink: 1ms; --spring-dur: 1ms; --spring-soft-dur: 1ms; --stagger: 0ms; }
</style>

<style>
/* =====================================================================
   base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--room); color: var(--text); overflow: hidden; }
body { font: 400 var(--t-ui)/var(--lh-ui) var(--f-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 70% 55% at 8% -6%, var(--glow-desk), transparent 70%); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: inherit; }
::selection { background: color-mix(in oklab, var(--text) 16%, transparent); }
:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; border-radius: 6px; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums lining-nums; }
[data-motion="off"] *, [data-motion="off"] *::before, [data-motion="off"] *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-delay: 0ms !important; } }
.no-anim, .no-anim * { transition: none !important; animation: none !important; }

/* ---- the two voices ---- */
.his { font-family: var(--f-his); font-optical-sizing: auto; color: var(--text); }
.read { font: 400 var(--t-read)/var(--lh-read) var(--f-his); font-optical-sizing: auto; color: var(--text); }
.her { font-family: var(--f-her); color: var(--her); font-size: var(--t-her); line-height: var(--lh-her); letter-spacing: -0.005em; }
.her em, .her i, .her.it { font-style: italic; }
.her-mark { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--her); box-shadow: 0 0 10px var(--her-glow); flex: none; }

/* ---- the book's voice ---- */
.display { font: 340 var(--t-h1)/1.04 var(--f-his); letter-spacing: -0.018em; font-optical-sizing: auto; margin: 0; }
.kicker { font: 500 var(--t-small)/1.3 var(--f-ui); color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.book-head { font: italic 400 var(--t-h3)/1.2 var(--f-his); color: var(--text); display: flex; align-items: baseline; gap: 14px; }
.book-head::after { content: ""; flex: 1; height: 1px; background: var(--hair-2); transform: translateY(-5px); min-width: 20px; }
.book-head .count { order: 3; font: 400 var(--t-small) var(--f-ui); color: var(--text-3); font-style: normal; }
.hint { font-size: var(--t-small); color: var(--text-3); }

/* ---- buttons: his actions are lamp-light, never her ink ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-pill); font: 550 var(--t-ui)/1 var(--f-ui); white-space: nowrap;
  transition: transform var(--d-1) var(--e-out), background var(--d-2), box-shadow var(--d-2), color var(--d-2); }
.btn:active { transform: scale(.97); }
.btn-lamp { background: var(--lamp); color: var(--on-lamp); box-shadow: 0 8px 22px -12px color-mix(in oklab, var(--lamp) 60%, transparent); }
.btn-lamp:hover { background: color-mix(in oklab, var(--lamp) 88%, var(--pane)); }
.btn-line { color: var(--text); box-shadow: inset 0 0 0 1px var(--hair-2); }
.btn-line:hover { background: var(--raised); }
.btn-quiet { color: var(--text-2); font-weight: 500; }
.btn-quiet:hover { color: var(--text); background: var(--raised); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-text { min-height: var(--tap); padding: 0 10px; border-radius: var(--r-m); font: 500 var(--t-ui) var(--f-ui); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.btn-text:hover { color: var(--text); background: var(--raised); }
.btn-text svg.ic { width: 16px; height: 16px; }
.icon-btn { width: 40px; height: 40px; border-radius: var(--r-m); display: inline-grid; place-items: center; color: var(--text-2); position: relative; flex: none;
  transition: background var(--d-1), color var(--d-1), transform var(--d-1); }
.icon-btn::after { content: ""; position: absolute; inset: -2px; }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn[aria-pressed="true"] { color: var(--text); }
.icon-btn.star[aria-pressed="true"] svg path { fill: currentColor; }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.link { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 3px; }
.link:hover { color: var(--text); text-decoration-color: currentColor; }
[data-tip]:hover::before { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 30; pointer-events: none;
  background: var(--lamp); color: var(--on-lamp); font: 500 12px/1 var(--f-ui); padding: 7px 9px; border-radius: 7px; animation: tipIn .18s var(--e-out) .4s both; }
@keyframes tipIn { from { opacity: 0; transform: translate(-50%, -3px); } }

/* =====================================================================
   shell · desktop: the rail on the desk, panes laid on it
   ===================================================================== */
#app { height: 100dvh; transform-origin: 50% 40%; transition: transform var(--d-4) var(--e-out), filter var(--d-4); }
body.room-open #app { transform: scale(.972); filter: brightness(var(--recede)) blur(2px); }
.desk { display: grid; grid-template-columns: auto minmax(0, 1fr); height: 100dvh; }
.rail { width: var(--rail); padding: 16px 12px 14px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; position: relative; }
.rail.compact { width: var(--rail-compact); }
.brand { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; margin-bottom: 12px; font: italic 400 23px/1 var(--f-his); letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 30px; height: 30px; flex: none; }
.rail .write { width: 100%; justify-content: flex-start; margin-bottom: 14px; padding: 0 14px; border-radius: var(--r-m); min-height: 46px; }
.rail .write kbd { margin-left: auto; font: 500 11px/1 var(--f-ui); opacity: .55; border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; }
.nav-i { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border-radius: 11px; color: var(--text-2); font: 500 var(--t-ui)/1 var(--f-ui); white-space: nowrap; width: 100%; text-align: left;
  transition: background var(--d-2), color var(--d-2), box-shadow var(--d-2); }
.nav-i:hover { color: var(--text); background: color-mix(in oklab, var(--nav-on) 55%, transparent); }
.nav-i.on { color: var(--text); background: var(--nav-on); box-shadow: var(--elev-tab); }
.nav-i .badge { margin-left: auto; font: 500 12px/1 var(--f-ui); color: var(--text-3); }
.rail-spacer { flex: 1; }
.rail-next { margin: 0 4px 10px; padding: 14px 10px 4px; border-top: 1px solid var(--hair-2); font-size: var(--t-small); color: var(--text-3); line-height: 1.45; }
.rail-next .rn-h { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }
.rail-next .rn-h svg { width: 12px; height: 12px; }
.rail-next .rn-t { font-variant-numeric: tabular-nums; color: var(--text-2); }
.rail-foot { display: flex; align-items: center; gap: 4px; }
.rail-foot .nav-i { flex: 1; }
.rail.compact .lbl, .rail.compact .badge, .rail.compact .wordmark, .rail.compact kbd, .rail.compact .rail-next { display: none; }
.rail.compact .write, .rail.compact .nav-i { width: 44px; padding: 0; justify-content: center; }
.rail.compact .rail-foot { flex-direction: column; }
.rail.compact .brand { padding: 0 7px; }

.stage { display: flex; gap: 10px; padding: 10px 10px 10px 0; min-width: 0; height: 100dvh; }
.pane { position: relative; background: var(--pane); border-radius: var(--r-l); box-shadow: var(--elev-1); outline: 1px solid var(--hair); outline-offset: -1px; min-width: 0; }
.scroller { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; }
.main-pane { flex: 1; }
.lamp-light { position: absolute; inset: 0 0 auto 0; height: 440px; pointer-events: none; border-radius: inherit;
  background: radial-gradient(ellipse 58% 100% at 50% 0%, var(--glow), transparent 74%); }
.page { position: relative; max-width: 1000px; margin: 0 auto; padding: 48px var(--gutter) 120px; }
.arrive { animation: arrive 460ms var(--e-out) both; }
@keyframes arrive { from { opacity: 0; transform: translateY(10px); } }
.rise { animation: rise 520ms var(--e-out) both; animation-delay: calc(var(--i, 0) * var(--stagger)); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* =====================================================================
   her letter (Folio), fastened: a postmark, a clip, or tape
   ===================================================================== */
.letter { position: relative; background: var(--her-wash); border-radius: 14px; padding: 22px 26px 20px; isolation: isolate;
  box-shadow: 0 0 0 1px var(--her-hair), var(--elev-letter); }
[data-fasten="clip"] .letter { border-radius: 3px 14px 14px 14px; }
.letter::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; border-top: 1px dashed var(--her-edge); } /* the crease of a letter opened flat */
.letter-from { font: 500 var(--t-small)/1.3 var(--f-ui); color: var(--her-soft); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-right: 64px; }
.letter-from .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--her); box-shadow: 0 0 10px var(--her-glow); }
.letter .her p { margin: 0 0 .7em; }
.letter .her p:last-child { margin-bottom: 0; }
.asked { font-style: italic; font-size: var(--t-her-lg); line-height: 1.6; }

.wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--text-3); opacity: .45; transition: background var(--d-1), opacity var(--d-1); }
.wave i.done { background: var(--text); opacity: 1; }
.audio .at { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.audio .rate { font: 600 12px/1 var(--f-ui); color: var(--text-2); height: 30px; min-width: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hair-2); }
.audio .rate:hover { background: var(--raised-2); }
/* keep writing */
.keep { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 8px 0 0; margin: 44px 0 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.keep .ph { flex: 1; font: italic 400 20px var(--f-his); color: var(--text-3); text-align: left; min-height: 62px; transition: color var(--d-2); }
.keep .ph:hover { color: var(--text-2); }
.keep kbd { font: 500 11px/1 var(--f-ui); color: var(--text-3); border: 1px solid var(--hair-2); border-radius: 4px; padding: 3px 5px; margin-right: 4px; }
/* her readings: Analysis and Reflection unfold at the end */
.readings { margin-top: 56px; }
.readings > .book-head { margin-bottom: 8px; }
.reading { border-top: 1px solid var(--hair-2); }
.reading:last-child { border-bottom: 1px solid var(--hair-2); }
.reading > .fold-head { padding: 14px 4px; min-height: 76px; align-items: center; }
.reading > .fold-head:hover { background: color-mix(in oklab, var(--raised) 60%, transparent); }
.env { width: 34px; height: 26px; color: var(--her); flex: none; }
.env path, .env rect { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.reading .rt { display: grid; gap: 2px; flex: 1; min-width: 0; }
.reading .rt b { font: 400 20px/1.2 var(--f-his); }
.reading .rt .rs { font-size: var(--t-small); color: var(--text-3); }
.reading .rt .fold-sum { font-size: 13px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.reading .fold-inner > div { padding: 4px 4px 30px 50px; }
.noticed { list-style: none; margin: 0; padding: 0; counter-reset: n; }
.noticed li { padding: 14px 0; border-bottom: 1px dashed var(--her-edge); display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; }
.noticed li::before { counter-increment: n; content: counter(n); font: 500 12px/1.9 var(--f-ui); color: var(--her-soft); grid-row: span 2; }
.noticed q { font: italic 400 18px/1.45 var(--f-his); color: var(--text); quotes: "“" "”"; }
.rd-label { font: 500 var(--t-small)/1 var(--f-ui); color: var(--text-3); margin: 22px 0 10px; }
.threads a { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; }
.threads a .her { flex: 1; }
.threads a .hint { white-space: nowrap; }
.refl-q { font: italic 400 1.5rem/1.35 var(--f-her); color: var(--her); margin: 10px 0 16px; letter-spacing: -0.02em; }
.refl-carry { margin-top: 18px; padding: 12px 16px; background: var(--her-wash-2); border-radius: 10px; }
.refl-carry .letter-from { margin-bottom: 2px; padding: 0; }
.toast { position: fixed; z-index: 90; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 18px; min-height: 48px;
  background: var(--lamp); color: var(--on-lamp); border-radius: 99px; box-shadow: var(--elev-pop); transition: transform var(--spring-dur) var(--spring), opacity var(--d-2); pointer-events: none; font: 500 14px var(--f-ui); white-space: nowrap; }
.toast:not(.show), .sheet:not(.show), .savebar:not(.show) { visibility: hidden; transition-property: transform, opacity, visibility; transition-delay: 0s, 0s, 400ms; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast .btn-text { color: var(--on-lamp); min-height: 36px; }
.toast .btn-text:hover { background: color-mix(in oklab, var(--on-lamp) 14%, transparent); color: var(--on-lamp); }
.scrim { position: fixed; inset: 0; z-index: 80; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--d-3); }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 81; left: 8px; right: 8px; bottom: 8px; padding: 8px; border-radius: var(--r-xl); background: var(--pane); box-shadow: var(--elev-pop); transform: translateY(115%); transition: transform var(--spring-soft-dur) var(--spring-soft); }
.sheet.show { transform: none; }
.sheet .quote { padding: 12px 14px 12px; font: italic 400 16px/1.45 var(--f-his); color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sheet .quote small { display: block; font: 500 12.5px var(--f-ui); font-style: normal; color: var(--text-3); margin-bottom: 4px; }
.sheet button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 14px; border-radius: 16px; font: 500 16px var(--f-ui); }
.sheet button:hover { background: var(--raised); }

/* =====================================================================
   WRITE · Night Room's room with her letter on top; it blooms out of the button pressed
   ===================================================================== */
.room { position: fixed; inset: 0; z-index: 50; background: var(--write-room); display: flex; flex-direction: column; visibility: hidden;
  clip-path: circle(22px at var(--bx, 50%) var(--by, 90%)); transition: clip-path 460ms cubic-bezier(.4, 0, .2, 1), visibility 0s 460ms; }
.room.open { visibility: visible; clip-path: circle(150vmax at var(--bx, 50%) var(--by, 90%)); transition: clip-path var(--d-bloom) var(--e-out), visibility 0s; }
.room::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 46% 62% at 50% 30%, var(--glow-room), transparent 72%); }
.room-top { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; padding: 0 16px; z-index: 2; transition: opacity var(--d-3); }
.room-top .ctx { font-size: 13.5px; color: var(--text-3); text-align: center; white-space: nowrap; }
.room-top .ctx b { color: var(--text-2); font: italic 400 16px var(--f-his); }
.room-top .r { justify-self: end; display: flex; gap: 4px; align-items: center; }
.saved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); padding: 0 10px; white-space: nowrap; }
.saved .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); transition: background var(--d-2); }
.saved.saving .sd { background: var(--text-2); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.5); opacity: .4; } }
.focus-t { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; font-size: 13.5px; color: var(--text-3); }
.focus-t:hover { background: var(--raised); color: var(--text); }
.focus-t[aria-pressed="true"] { color: var(--text); background: color-mix(in oklab, var(--raised) 70%, transparent); }
.room-body { position: relative; flex: 1; overflow-y: auto; scrollbar-width: none; }
.room-col { position: relative; max-width: 720px; margin: 0 auto; padding: 5vh 28px 220px; }
.room-letter { margin-bottom: 48px; transform: translateY(-12px); opacity: 0; transition: transform 600ms var(--e-paper), opacity 300ms ease; }
.room.open .room-letter { transform: none; opacity: 1; transition: transform 700ms var(--e-paper) 220ms, opacity 400ms ease 220ms; }
.room-letter .qlist { columns: 1; }
.room-letter .asked { transition: opacity 200ms, transform 300ms var(--e-out); }
.room-none { margin-bottom: 36px; color: var(--text-3); font: italic 400 17px var(--f-his); }
.room-page { position: relative; }
.room-mg { position: absolute; left: -92px; top: 0; width: 64px; height: 100%; }
.room-mg time { position: absolute; right: 0; font: italic 400 15px/1 var(--f-his); color: var(--text-3); font-variant-numeric: tabular-nums lining-nums; animation: rise 400ms var(--e-out) both; transition: opacity var(--d-3); }
.ed { font: 400 var(--t-write)/var(--lh-write) var(--f-his); letter-spacing: -.004em; outline: 0; min-height: 40vh; caret-color: var(--text); color: var(--text); font-optical-sizing: auto; }
.ed > p, .ed > div { margin: 0 0 .75em; transition: opacity 500ms var(--e-out); }
.ed.focus > :not(.cur) { opacity: var(--focus-dim); }
.ed.blank::before { content: attr(data-ph); color: var(--text-3); font-style: italic; pointer-events: none; position: absolute; }
.ed .vchip { display: inline-flex; align-items: center; gap: 10px; font: 500 13.5px var(--f-ui); color: var(--text-2); padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair-2); user-select: none; }
.ed .vchip svg.ic { width: 16px; height: 16px; }
.dock { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
  width: min(720px, calc(100% - 24px)); padding: 10px 10px 10px 22px; border-radius: 30px; background: var(--frost); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: var(--elev-pop); z-index: 3; }
.dock .count { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dock .r { justify-self: end; }
.orb-wrap { position: relative; display: grid; place-items: center; width: 60px; height: 60px; }
.orb { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: radial-gradient(circle at 50% 35%, var(--raised-2), var(--raised));
  box-shadow: inset 0 0 0 1px var(--hair-2), 0 6px 18px -8px rgb(0 0 0 / .4); transition: transform var(--spring-dur) var(--spring), background var(--d-2), color var(--d-2); }
.orb:hover { transform: scale(1.05); }
.orb svg.ic { width: 22px; height: 22px; }
.orb-wrap .ring { position: absolute; inset: 4px; border-radius: 50%; background: color-mix(in oklab, var(--lamp) 14%, transparent); opacity: 0; }
.orb-wrap.rec .orb { background: var(--lamp); color: var(--on-lamp); animation: breathe 3.2s ease-in-out infinite; }
.orb-wrap.rec .ring { opacity: 1; transform: scale(calc(1.15 + var(--lvl, 0) * .55)); transition: transform 120ms linear; }
.orb-wrap.rec .ring.r2 { animation: halo 2.6s ease-out infinite; transform: none; background: none; box-shadow: 0 0 0 1px color-mix(in oklab, var(--lamp) 30%, transparent); }
@keyframes breathe { 50% { transform: scale(1.07); } }
@keyframes halo { from { transform: scale(1); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
.rec-time { color: var(--text); }

/* =====================================================================
   TODAY (Folio, in this system)
   ===================================================================== */
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 56px; }
.today-head { display: grid; grid-template-columns: auto 1fr; gap: 0 20px; align-items: end; margin-bottom: 28px; }
.today-head .bignum { text-align: left; font-size: 104px; padding: 0; }
.today-head .dl { padding-bottom: 8px; }
.today-head .dl .display { font-size: 2.5rem; }
.today-head .dateline { margin: 8px 0 0; color: var(--text-3); font-size: var(--t-small); }
.weekstrip { list-style: none; margin: 0 0 40px; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--hair-2); border-bottom: 1px solid var(--hair-2); }
.weekstrip li { text-align: center; padding: 10px 2px 12px; }
.weekstrip button { width: 100%; display: grid; justify-items: center; gap: 4px; border-radius: 12px; padding: 6px 0; min-height: var(--tap); transition: background var(--d-1); }
.weekstrip button:hover { background: var(--raised); }
.ws-d { font: 500 11.5px/1 var(--f-ui); color: var(--text-3); }
.ws-n { font: 400 21px/1.1 var(--f-his); font-variant-numeric: lining-nums; }
.ws-mark { width: 7px; height: 7px; border-radius: 50%; }
.ws-mark.answered { background: var(--text); }
.ws-mark.missed { box-shadow: inset 0 0 0 1.3px var(--text-3); }
.ws-mark.none { width: 10px; height: 1.3px; border-radius: 1px; background: var(--hair-2); margin: 3px 0; }
.weekstrip .is-today button { background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair-2); }
.weekstrip .is-today .ws-n { font-weight: 600; }
.sec { margin-bottom: 40px; }
.sec > .book-head { margin-bottom: 18px; }
.prompt-letter { margin-top: 26px; padding: 26px 28px 20px; }
.letter-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--her-edge); }
.letter-actions .hint { margin-left: auto; }
.leaders { list-style: none; margin: 0; padding: 0; }
.leaders li { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.leaders .t { font: 400 18px/1.3 var(--f-his); }
.leaders .s { display: block; font-size: var(--t-small); color: var(--text-3); }
.leaders .lead { flex: 1; border-bottom: 1.5px dotted var(--hair-2); transform: translateY(-5px); min-width: 16px; }
.leaders .v { font-size: var(--t-small); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.written a { display: block; padding: 12px 10px; margin: 0 -10px; border-radius: 12px; border-bottom: 1px solid var(--hair); transition: background var(--d-1); }
.written a:hover { background: var(--raised); }
.written .his { font-size: 17.5px; color: var(--text-2); line-height: 1.45; display: block; margin-top: 2px; }
.carry { padding: 22px 0 0; border-top: 1px solid var(--hair-2); }
.carry .her { font-size: 1.2rem; line-height: 1.45; font-style: italic; margin: 10px 0 10px; display: block; }
/* the programs strip (Night Room) */
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 12px 0; }
.prog-row .pt { font: 400 18px/1.3 var(--f-his); }
.prog-row .pm { color: var(--text-3); font-size: var(--t-small); }
.segs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(var(--n, 10), 1fr); gap: 4px; margin-top: 8px; }
.segs i { height: 4px; border-radius: 2px; background: var(--hair-2); position: relative; overflow: hidden; }
.segs i.done { background: var(--text); }
.segs i.now::after { content: ""; position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(.4); animation: segfill 1.4s var(--e-out) both .3s; }
@keyframes segfill { from { transform: scaleX(0); } }
.segs i { animation: segin 500ms var(--e-out) both; animation-delay: calc(var(--k) * 40ms); }
@keyframes segin { from { opacity: 0; transform: scaleY(0); } }

/* =====================================================================
   INSIGHTS (Folio's page + Night Room's strip + an Almanac numeral)
   ===================================================================== */
.ins { max-width: 1080px; }
.ins-top { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; }
.ins-top .kicker { min-width: 120px; justify-content: center; }
.ins-title { text-align: center; margin: 0 0 44px; }
.ins-title .nums { font: 300 var(--t-numeral)/.95 var(--f-his); letter-spacing: -.04em; font-variant-numeric: lining-nums; }
.ins-title em { font: italic 300 3rem/1 var(--f-his); letter-spacing: -.02em; margin-left: 14px; color: var(--text-2); }
.ins-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 64px; align-items: start; }
.prose-figs { font: 400 1.7rem/1.42 var(--f-his); color: var(--text-2); margin: 0 0 40px; letter-spacing: -0.01em; text-wrap: pretty; }
.prose-figs b { font-weight: 500; color: var(--text); font-variant-numeric: lining-nums; }
.ledger { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; height: 200px; border-bottom: 1px solid var(--text); position: relative; margin-bottom: 8px; }
.ledger::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to top, transparent 0 39px, var(--hair) 39px 40px); pointer-events: none; }
.lcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; gap: 6px; }
.lcol .w { font: 500 12px/1 var(--f-ui); color: var(--text-3); font-variant-numeric: tabular-nums; animation: rise 400ms var(--e-out) both; animation-delay: calc(300ms + var(--i) * 60ms); }
.lcol .bar { flex: none; width: 10px; border-radius: 6px 6px 0 0; background: var(--text); height: var(--h); transform-origin: bottom; animation: grow 700ms var(--e-paper) both; animation-delay: calc(80ms + var(--i) * 60ms); }
.lcol.future .bar { background: none; border: 1.5px dashed var(--hair-2); border-bottom: 0; height: 26px; }
.lcol.zero .bar { height: 2px; background: var(--text-3); border-radius: 1px; width: 14px; }
@keyframes grow { from { transform: scaleY(0); } }
.ldays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.ldays div { display: grid; justify-items: center; gap: 3px; padding-top: 6px; }
.ldays .d { font: 500 12px/1 var(--f-ui); color: var(--text-3); }
.ldays .n { font: 400 17px/1 var(--f-his); font-variant-numeric: lining-nums; }
.ldays .rf { width: 6px; height: 6px; border-radius: 50%; background: var(--her); box-shadow: 0 0 8px var(--her-glow); margin-top: 4px; }
.ldays .rf.no { background: none; box-shadow: none; }
.ledger-key { display: flex; gap: 22px; flex-wrap: wrap; margin: 16px 0 44px; font-size: var(--t-small); color: var(--text-3); }
.ledger-key span { display: inline-flex; align-items: center; gap: 7px; }
.ins-sec { margin-bottom: 40px; }
.ins-sec > .book-head { margin-bottom: 6px; font-size: 18px; }
.review .letter { padding: 28px 28px 8px; }
.pull { font: italic 400 1.3rem/1.5 var(--f-her); color: var(--her); margin: 8px 0 14px 0.4em; letter-spacing: -0.02em; text-wrap: pretty; position: relative; }
.pull::before { content: "“"; position: absolute; left: -.7em; top: -.05em; opacity: .5; }
.review .fold-head { color: var(--her); font: 500 var(--t-small) var(--f-ui); border-top: 1px dashed var(--her-edge); border-radius: 0; min-height: 50px; }
.review .fold-head .chev { color: var(--her-soft); margin-left: auto; }
.review .fold-inner > div { padding: 4px 0 20px; }
.review .ask { margin: 4px 0 20px; padding: 14px 0 0; border-top: 1px dashed var(--her-edge); }
.review-pending { font: italic 400 18px/1.5 var(--f-his); color: var(--text-3); padding: 20px 0; border-top: 1px solid var(--hair-2); border-bottom: 1px solid var(--hair-2); }
.slips { margin-top: 40px; }
.slips > .book-head { margin-bottom: 10px; font-size: 18px; }
.rslip { border-bottom: 1px solid var(--hair); }
.rslip > .fold-head { padding: 8px 0; min-height: 64px; gap: 14px; }
.rslip .day-n { font: 300 28px/1 var(--f-his); width: 40px; font-variant-numeric: lining-nums; text-align: center; flex: none; }
.rslip .day-n small { display: block; font: 500 11px/1.4 var(--f-ui); color: var(--text-3); }
.rslip .her { flex: 1; font-style: italic; }
.rslip .fold-inner > div { padding: 0 0 18px 54px; }

/* =====================================================================
   LIBRARY (Folio's rows, ribbons, Night Room's clocks)
   ===================================================================== */
.lib-head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 10px; }
.lib-head p { margin: 14px 0 0; color: var(--text-2); font: 400 19px/1.5 var(--f-his); max-width: 34rem; }
.lib-legend { margin: 0 0 36px; display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: var(--t-small); }
.lib-group { margin-bottom: 44px; }
.lib-group > .book-head { margin-bottom: 4px; }
.prac { display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto; gap: 0 14px; align-items: start; padding: 18px 0; border-bottom: 1px solid var(--hair); position: relative; }
.prac.off .prac-main { opacity: .55; }
.ribbon { width: 12px; height: 34px; margin-top: -18px; justify-self: center; color: var(--text); }
.ribbon path { fill: currentColor; }
.ribbon.edited path { fill: none; stroke: currentColor; stroke-width: 1.5; }
.dial { width: 40px; height: 40px; margin-top: 2px; }
.dial circle.rim { fill: none; stroke: var(--hair-2); stroke-width: 1.2; }
.dial circle.rim.dash { stroke-dasharray: 2 3.2; }
.dial circle.rim.night { fill: var(--raised-2); }
.dial circle.tick { fill: var(--text-3); }
.dial line { stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; }
.dial circle.hub { fill: var(--text); }
.dial circle.arc { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 20px 20px; }
.dial text { font: 600 8.5px var(--f-ui); fill: var(--text-2); text-anchor: middle; }
.prac-title { display: flex; align-items: baseline; gap: 12px; }
.prac-title h3 { font: 400 22px/1.25 var(--f-his); letter-spacing: -0.005em; }
.prac-title .lead { flex: 1; border-bottom: 1.5px dotted var(--hair-2); transform: translateY(-6px); min-width: 20px; }
.prac-title .cad { font-size: var(--t-small); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prac-desc { margin: 4px 0 0; font: 400 16.5px/1.5 var(--f-his); color: var(--text-2); max-width: 36rem; }
.colophon { margin-top: 8px; font-size: var(--t-small); color: var(--text-3); display: flex; flex-wrap: wrap; align-items: center; }
.colophon > span + span::before { content: "·"; margin: 0 8px; }
.colophon .mine { color: var(--text); font-weight: 550; }
.colophon .segs { display: inline-grid; width: 120px; margin: 0 0 0 10px; vertical-align: middle; }
.prac-side { display: flex; align-items: center; gap: 6px; }
.add-prac { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 0 0 0 36px; font: italic 400 19px var(--f-his); color: var(--text-3); border-bottom: 1px solid var(--hair); text-align: left; }

/* switch (Night Room's, his lamp when on) */
.tog { width: 52px; height: 32px; border-radius: 999px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--hair-2); position: relative; transition: background var(--d-2); flex: none; }

.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--pane); box-shadow: 0 1px 3px rgb(0 0 0 / .22); transition: transform var(--spring-dur) var(--spring), background var(--d-2), width var(--d-1); }

/* =====================================================================
   SETTINGS (Almanac's layout, Folio's warmth and controls)
   ===================================================================== */
.set { max-width: 1060px; margin: 0 auto; padding: 48px var(--gutter) 160px; position: relative; }
.set-head { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; align-items: end; margin-bottom: 52px; }
.set-head .display { font-size: var(--t-display); letter-spacing: -.03em; font-weight: 300; }
.set-head .lede { font: 400 19px/1.5 var(--f-his); color: var(--text-2); margin-top: 14px; max-width: 30rem; }
.glance { border-top: 2px solid var(--text); padding-top: 10px; }
.glance .kicker { margin-bottom: 4px; }
.glance a { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: center; padding: 10px 6px; margin: 0 -6px; border-bottom: 1px solid var(--hair); min-height: 58px; border-radius: 10px 10px 0 0; transition: background var(--d-1); }
.glance a:hover { background: var(--raised); }
.glance b { display: block; font: 500 var(--t-ui)/1.3 var(--f-ui); }
.glance .hint { display: block; }
.glance .g-marks { display: flex; flex-wrap: wrap; gap: 2px; width: 22px; }
.glance .g-marks .hm { width: 6px; height: 6px; }
.glance .g-seal { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--text); margin-left: 3px; }
.glance .g-ink { width: 16px; height: 16px; border-radius: 50%; background: var(--her); margin-left: 2px; box-shadow: 0 0 10px var(--her-glow); }
.set-grid { display: grid; grid-template-columns: 210px minmax(0, 640px); gap: 56px; }
.sindex { position: sticky; top: 24px; align-self: start; }
.sindex ol { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--text); }
.sindex a { display: grid; grid-template-columns: 2.3rem 1fr auto; align-items: baseline; min-height: 44px; padding: 10px 0; border-bottom: 1px solid var(--hair); color: var(--text-2); font: 500 var(--t-ui)/1.3 var(--f-ui); transition: color var(--d-2), box-shadow var(--d-3) var(--e-out), padding var(--d-3) var(--e-out); }
.sindex a .n { font: 300 22px/1 var(--f-his); color: var(--text-3); font-variant-numeric: lining-nums; }
.sindex a:hover, .sindex a[aria-current="true"] { color: var(--text); }
.sindex a[aria-current="true"] { box-shadow: inset 2px 0 0 var(--text); padding-left: 10px; }
.sindex a[aria-current="true"] .n { color: var(--text); }
.sindex .hd { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px var(--text-2); align-self: center; }
.ssec { margin-bottom: 60px; scroll-margin-top: 30px; }
.ssec > h2 { display: flex; align-items: baseline; gap: 16px; font: 400 var(--t-h2)/1.1 var(--f-his); letter-spacing: -.01em; border-top: 1px solid var(--hair-2); padding-top: 14px; margin-bottom: 6px; }
.ssec > h2 .n { font: 300 15px/1 var(--f-his); color: var(--text-3); font-variant-numeric: lining-nums; }
.ssec > .lede { margin: 0 0 18px; font: 400 17px/1.5 var(--f-his); color: var(--text-2); }
.group { background: var(--pane); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair-2), var(--elev-tab); }
[data-theme="dark"] .group { background: color-mix(in oklab, var(--raised) 70%, var(--pane)); }
.srow { display: flex; align-items: center; gap: 16px; padding: 14px 18px; min-height: 70px; }
.srow + .srow, .srow-fold + .srow, .srow + .srow-fold .srow { box-shadow: 0 -1px 0 var(--hair); }
.srow .lab { flex: 1; min-width: 0; }
.srow .lab b { display: block; font: 500 var(--t-ui)/1.35 var(--f-ui); }
.srow .lab .hint { display: flex; gap: 0 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; line-height: 1.45; }
.srow .def { color: var(--text-3); font-style: italic; font-family: var(--f-his); font-size: 14px; }
.srow .reset { font: 500 12.5px var(--f-ui); color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--hair-2); padding: 2px 0; display: none; }
.srow.changed .reset { display: inline; animation: rise 300ms var(--e-out) both; }
.srow.changed .lab b::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text); margin-left: 8px; vertical-align: middle; }
.srow.locked .lab b { color: var(--text-2); }
.lockline { display: inline-flex; align-items: center; gap: 5px; }
.lockline svg.ic { width: 13px; height: 13px; }
.srow-fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--spring-soft-dur) var(--spring-soft), opacity var(--d-2); }

.srow-fold > div { overflow: hidden; min-height: 0; }
.stepper { display: inline-flex; align-items: center; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--hair-2); flex: none; }

.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; position: relative; box-shadow: inset 0 0 0 1px var(--hair); flex: none; }
.seg button { position: relative; z-index: 1; min-height: 38px; padding: 0 14px; border-radius: 9px; font: 500 13.5px var(--f-ui); color: var(--text-3); transition: color var(--d-2); white-space: nowrap; }

.seg .thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: 9px; background: var(--pane); box-shadow: var(--elev-tab), 0 0 0 1px var(--hair); transition: transform var(--spring-dur) var(--spring), width var(--spring-dur) var(--spring); }

.val { font: 400 17px var(--f-his); color: var(--text); }
/* her ink: a joy (Folio) */
.inks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.inkopt { display: grid; align-content: start; justify-items: center; gap: 6px; padding: 18px 8px 14px; border-radius: 16px; text-align: center; transition: background var(--d-2), box-shadow var(--d-2); position: relative; }

[data-theme="dark"] .inkopt[aria-checked="true"] { background: var(--raised); }
.blot { width: 54px; height: 48px; color: var(--her); transition: transform 500ms var(--e-paper); filter: drop-shadow(0 0 10px var(--her-glow)); }
.blot path { fill: currentColor; }

@keyframes blink { 50% { opacity: 0; } }
/* health: status without hue */
.health-sum { display: flex; align-items: center; gap: 16px; padding: 16px 18px; width: 100%; text-align: left; border-radius: 16px; min-height: 80px; }
.health-sum:hover { background: var(--raised); }
.marks { display: flex; gap: 3px; flex-wrap: wrap; width: 92px; flex: none; }
.hm { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px var(--text-3); }
.hm.ok { background: var(--text-3); box-shadow: none; opacity: .5; }
.hm.warn { background: linear-gradient(90deg, var(--text) 50%, transparent 50%); box-shadow: inset 0 0 0 1.3px var(--text); }
.hm.fail { background: var(--text); box-shadow: 0 0 0 2px var(--pane), 0 0 0 3px var(--text); }
.health-sum .lab { flex: 1; }
.health-sum .lab b { display: block; font: 400 20px/1.3 var(--f-his); }
.hlist { list-style: none; margin: 0; padding: 0 18px 10px; }
.hlist li { display: grid; grid-template-columns: 18px 150px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); align-items: baseline; font-size: 14px; }
.hlist li b { font-weight: 500; }

.hlist .sep { display: block; padding: 14px 0 4px; font: italic 400 15px var(--f-his); color: var(--text-3); }
.savebar { position: fixed; z-index: 40; left: calc(var(--rail) + (100% - var(--rail)) / 2); bottom: 26px; transform: translate(-50%, 140%); opacity: 0; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 20px;
  background: var(--frost); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border-radius: 99px; box-shadow: var(--elev-pop); transition: transform var(--spring-soft-dur) var(--spring-soft), opacity var(--d-2); font: 500 14px var(--f-ui); color: var(--text-2); white-space: nowrap; }

/* =====================================================================
   MARK specimen
   ===================================================================== */
.mk-intro { font: 400 19px/1.5 var(--f-his); color: var(--text-2); max-width: 40rem; margin: 14px 0 40px; }
.mk-opt { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding: 30px 0; border-top: 1px solid var(--hair-2); }

  background: var(--frost); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: var(--elev-pop); z-index: 20; }

/* =====================================================================
   view transitions (Night Room): panes morph, the entry floats in, phone pushes
   ===================================================================== */
@media (min-width: 761px) {
  .rail { view-transition-name: rail; }
  .vt-page { view-transition-name: page; }
  .vt-entry { view-transition-name: entrypane; }
  .vt-kicker { view-transition-name: entry-kicker; }
}
.tabbar { view-transition-name: tabbar; }
::view-transition-group(*) { animation-duration: var(--spring-soft-dur); animation-timing-function: var(--spring-soft); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 240ms; }
::view-transition-image-pair(page), ::view-transition-image-pair(rail), ::view-transition-image-pair(entrypane) { overflow: hidden; border-radius: 18px; }
::view-transition-old(page), ::view-transition-new(page), ::view-transition-old(rail), ::view-transition-new(rail), ::view-transition-old(entrypane), ::view-transition-new(entrypane) { height: 100%; width: auto; object-fit: none; object-position: left top; }
::view-transition-old(page) { animation: 200ms ease both vtOut; }
::view-transition-new(page) { animation: 360ms 60ms ease both vtIn; }
::view-transition-old(page):only-child { animation: sideOut 300ms var(--e-out) both; }
::view-transition-new(page):only-child { animation: sideIn var(--spring-soft-dur) var(--spring-soft) both; }
::view-transition-old(entrypane) { animation: 180ms ease both vtOut; }
::view-transition-new(entrypane) { animation: 320ms 40ms ease both vtIn; }
::view-transition-new(entrypane):only-child { animation: paneIn var(--spring-soft-dur) var(--spring-soft) both; }
::view-transition-old(entrypane):only-child { animation: paneOut 320ms var(--e-out) both; }
::view-transition-old(rail) { animation: 200ms ease both vtOut; }
::view-transition-new(rail) { animation: 300ms ease both vtIn; }
::view-transition-group(rail), ::view-transition-group(tabbar) { z-index: 30; }
@keyframes vtOut { to { opacity: 0; } }
@keyframes vtIn { from { opacity: 0; } }
@keyframes paneIn { from { opacity: 0; transform: translateX(56px) scale(.985); } }
@keyframes paneOut { to { opacity: 0; transform: translateX(56px) scale(.985); } }
@keyframes sideIn { from { opacity: 0; transform: translateX(-24px); } }
@keyframes sideOut { to { opacity: 0; transform: translateX(-24px); } }

function wave(n, seed) {
  let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  return Array.from({ length: n }, (_, i) => { const env = 0.35 + 0.65 * Math.sin(Math.PI * (i + .5) / n) ** .6; return Math.max(.14, Math.min(1, env * (0.35 + r() * .75))); });
}

function dial(p) {

    return `<svg class="dial" viewBox="0 0 40 40" aria-hidden="true"><circle class="rim" cx="20" cy="20" r="15"/><circle class="arc" cx="20" cy="20" r="15" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}"/><text x="20" y="23">${p.prog}/${p.sessions}</text></svg>`; }
  if (!p.at) return `<svg class="dial" viewBox="0 0 40 40" aria-hidden="true"><circle class="rim dash" cx="20" cy="20" r="15"/><circle class="hub" cx="20" cy="20" r="2"/></svg>`;
  const [h, m] = p.at.split(':').map(Number); const a = (((h % 12) + m / 60) / 12) * 2 * Math.PI - Math.PI / 2;
  const x = 20 + Math.cos(a) * 10, y = 20 + Math.sin(a) * 10; const night = h >= 18 || h < 6;
  return `<svg class="dial" viewBox="0 0 40 40" aria-hidden="true"><circle class="rim ${night ? 'night' : ''}" cx="20" cy="20" r="15"/>${[0, 3, 6, 9].map((k) => { const t = (k / 12) * 2 * Math.PI - Math.PI / 2; return `<circle class="tick" cx="${(20 + Math.cos(t) * 12.5).toFixed(1)}" cy="${(20 + Math.sin(t) * 12.5).toFixed(1)}" r=".9"/>`; }).join('')}<line x1="20" y1="20" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><circle class="hub" cx="20" cy="20" r="2"/>${p.wd ? `<text x="20" y="${y > 22 ? 15 : 31}">${p.wd}</text>` : ''}</svg>`;
}

}
let toastT, undoFn = null;

/* =======================================================================
   settings behaviour
   ======================================================================= */

function updateRow(r) {

}
const addTime = (t, mins) => { const [h, m] = t.split(':').map(Number); const x = (h * 60 + m + mins + 1440) % 1440; return `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
$('#discard').addEventListener('click', () => { allRows().forEach((r) => { r.v = initial[r.id]; updateRow(r); }); });
$('#saveBtn').addEventListener('click', () => { allRows().forEach((r) => initial[r.id] = r.v); markDirty(); toast('Settings saved'); });
function spy() {

  let cur = 'ink'; $$('.ssec').forEach((s) => { if (s.getBoundingClientRect().top < 200) cur = s.id.slice(2); });
  $$('.sindex a').forEach((a) => a.setAttribute('aria-current', a.dataset.jump === cur));
}

/* =======================================================================
   entry behaviour: open, step, block actions, player
   ======================================================================= */
function openEntry(stem, foldTarget) {
  if (foldTarget) S.open.add(foldTarget);
  if (S.route === 'entry') { S.stem = stem; transition('doc', () => { replaceHash(); render(); const ep = $('#entryPane'); if (ep) ep.scrollTop = 0; }); }
  else { S.from = S.route; go({ route: 'entry', stem }, 'open'); }
  if (foldTarget) setTimeout(() => { const f = $(`[data-fold="${foldTarget}"]`); if (f) f.scrollIntoView({ behavior: still() ? 'auto' : 'smooth', block: 'center' }); }, still() ? 0 : 650);
}
function closeEntry() { go({ route: 'entries' }, 'close'); }
function setSidebar(v) {
  if (!SIDES.includes(v) || v === S.sidebar) return; store.set('journal:sidebar', v);
  transition('side', () => { S.sidebar = v; replaceHash(); render(); });
}
function blockAct(blk, act) {
  const bd = $('.bd', blk), c2 = $('.c2', blk);
  if (act === 'edit') { blk.classList.add('editing'); bd.dataset.orig = bd.innerHTML; bd.contentEditable = 'true'; bd.focus();
    c2.insertAdjacentHTML('beforeend', `<div class="edit-bar"><button class="btn btn-lamp sm" data-edit="save">Save</button><button class="btn btn-quiet sm" data-edit="cancel">Cancel</button><span class="hint">Only this passage changes; Ada’s words stay as they are.</span></div>`); }
  if (act === 'copy') { navigator.clipboard?.writeText(bd.innerText).catch(() => {}); toast('Copied your words'); }
  if (act === 'delete') { if ($('.confirm', blk)) return; c2.insertAdjacentHTML('beforeend', `<div class="confirm" role="group" aria-label="Delete this passage?">Delete this passage?<button class="btn btn-lamp sm" data-bact="really">Delete</button><button class="btn btn-quiet sm" data-bact="keep">Keep</button></div>`); }
  if (act === 'keep') $('.confirm', blk)?.remove();
  if (act === 'really') { $('.confirm', blk)?.remove(); blk.style.maxHeight = blk.offsetHeight + 'px'; blk.classList.add('removing');
    const t = setTimeout(() => { blk.hidden = true; }, 430);
    toast('Passage deleted', () => { clearTimeout(t); blk.hidden = false; blk.classList.remove('removing'); blk.style.maxHeight = ''; }); }
}
let sheetBlk = null, pressT;
function openSheet(blk) {

  $$('#sheet [data-sheet]').forEach((b) => { const k = b.dataset.sheet; b.innerHTML = ic(k === 'edit' ? 'pen' : k === 'copy' ? 'copy' : 'trash') + (k === 'edit' ? 'Edit these words' : k === 'copy' ? 'Copy' : 'Delete…'); });
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
}
function closeSheet() { $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); }
$('#scrim').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', (e) => { const b = e.target.closest('[data-sheet]'); if (!b || !sheetBlk) return; const blk = sheetBlk; closeSheet(); setTimeout(() => blockAct(blk, b.dataset.sheet === 'delete' ? 'delete' : b.dataset.sheet), 250); });
document.addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.blk.his'); if (!b || !isPhone() || ev.target.closest('.audio,.edit-bar,.confirm,[contenteditable="true"]')) return;
  b.classList.add('pressing'); pressT = setTimeout(() => { b.classList.remove('pressing'); openSheet(b); }, 480);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => document.addEventListener(t, () => { clearTimeout(pressT); $$('.pressing').forEach((x) => x.classList.remove('pressing')); }, true));
document.addEventListener('scroll', () => clearTimeout(pressT), true);
document.addEventListener('contextmenu', (e) => { if (isPhone() && e.target.closest('.blk.his')) e.preventDefault(); });
const playing = new Map();
function setPos(au, s) {
  const dur = +au.dataset.dur; s = Math.max(0, Math.min(dur, s)); au.dataset.pos = s;
  const bars = $$('.wave i', au), k = Math.round((s / dur) * bars.length); bars.forEach((b, i) => b.classList.toggle('done', i < k));
  $('.pos', au).textContent = fmtDur(s); $('.wave', au).setAttribute('aria-valuenow', Math.round(s));
}

  if (playing.has(au)) { cancelAnimationFrame(playing.get(au)); playing.delete(au); btn.innerHTML = ic('play'); btn.setAttribute('aria-label', 'Play your voice'); return; }
  btn.innerHTML = ic('pause'); btn.setAttribute('aria-label', 'Pause'); let last = performance.now();
  const step = (now) => { const rate = parseFloat($('.rate', au).textContent) || 1; setPos(au, +au.dataset.pos + ((now - last) / 1000) * rate * 4); last = now; if (+au.dataset.pos >= +au.dataset.dur) { playToggle(au); setPos(au, 0); return; } playing.set(au, requestAnimationFrame(step)); };
  playing.set(au, requestAnimationFrame(step));

/* =======================================================================
   one click handler
   ======================================================================= */
document.addEventListener('click', (ev) => {

  const mc = t.closest('[data-menu]'); if (mc) { ev.preventDefault(); if (!menu.hidden && menu.dataset.which === mc.dataset.menu) hideMenu(); else showMenu(mc); return; }

  const ed = t.closest('[data-edit]'); if (ed) { const blk = ed.closest('.blk'); const bd = $('.bd', blk); if (ed.dataset.edit === 'cancel') bd.innerHTML = bd.dataset.orig; bd.contentEditable = 'false'; blk.classList.remove('editing'); $('.edit-bar', blk)?.remove(); if (ed.dataset.edit === 'save') toast('Saved to the entry'); return; }
  const day = t.closest('[data-day]'); if (day) {
    const ds = day.dataset.day;
    if (day.closest('.weekstrip')) { S.filt.day = ENTRIES.some((e) => e.date === ds) ? ds : null; S.month = D(ds).getMonth(); go({ route: 'entries' }); return; }
    S.filt.day = S.filt.day === ds ? null : ds; refreshEntries(); return; }
  const op = t.closest('[data-open]'); if (op) { ev.preventDefault(); openEntry(op.dataset.open, op.dataset.foldTarget); return; }
  const nav = t.closest('[data-nav]'); if (nav) { ev.preventDefault(); const r = nav.dataset.nav; if (S.room) closeRoom(); if (r === S.route) return; go({ route: r }); return; }
  const sd = t.closest('[data-side]'); if (sd) { setSidebar(sd.dataset.side); return; }
  const st = t.closest('[data-step]'); if (st) { const vis = filtered().map((e) => e.stem); const i = vis.indexOf(S.stem) + Number(st.dataset.step); if (vis[i]) openEntry(vis[i]); return; }
  const wk = t.closest('[data-wk]'); if (wk) { const n = S.wk + Number(wk.dataset.wk); if (!WEEKS[n]) return; S.wk = n; S.open.delete('review'); const b = $('#insBody'); b.innerHTML = insBody(); if (!still()) { b.classList.remove('arrive'); void b.offsetWidth; b.classList.add('arrive'); } $('.ins-top .kicker').textContent = WEEKS[n].label; $('[data-wk="-1"]').disabled = n === 0; $('[data-wk="1"]').disabled = n === WEEKS.length - 1; replaceHash(); return; }
  const ink = t.closest('.inkopt'); if (ink) { setInk(ink.dataset.ink); return; }
  const ts = t.closest('[data-theme-set]'); if (ts) { setTheme(ts.dataset.themeSet); return; }
  const jp = t.closest('[data-jump]'); if (jp) { ev.preventDefault(); const s = $('#s-' + jp.dataset.jump); if (s) s.scrollIntoView({ behavior: still() ? 'auto' : 'smooth', block: 'start' }); if (jp.dataset.jump === 'health' && jp.closest('.glance')) { const f = $('[data-fold="health"]'); f.dataset.open = 'true'; S.open.add('health'); } return; }

    else if (t.closest('.tog')) r.v = !r.v;
    else if (t.closest('.seg button')) r.v = t.closest('.seg button').dataset.v;
    else if (t.closest('[data-reset]')) r.v = r.def;
    else return;
    updateRow(r); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'theme': setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'); break;
    case 'back-list': closeEntry(); break;
    case 'clear': { S.filt = { kind: 'all', practice: 'any', q: '', day: null }; const qi = $('#q'); if (qi) qi.value = ''; refreshEntries(); break; }
    case 'mprev': S.month = Math.max(0, S.month - 1); refreshEntries(false); break;
    case 'mnext': S.month = Math.min(11, S.month + 1); refreshEntries(false); break;
    case 'star': { const on = !S.starred.has(S.stem); on ? S.starred.add(S.stem) : S.starred.delete(S.stem); a.setAttribute('aria-pressed', on); toast(on ? 'Starred' : 'Star removed'); break; }

    case 'run': toast('The run screen is not drawn in this round'); break;
    case 'todo': toast('Not drawn in this round'); break;

      if (still()) { q.textContent = L.qs[S.qi][1]; break; }
      q.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 160, easing: 'ease-in' }).onfinish = () => { q.textContent = L.qs[S.qi][1]; q.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.16,1,.3,1)' }); }; break; }
  }
});
room.addEventListener('click', (e) => { if (e.target.closest('#focusBtn')) setFocus(!S.focus); });

/* =======================================================================
   keys
   ======================================================================= */
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]');
  if (e.key === 'Escape') {
    if (!menu.hidden) hideMenu(); else if ($('#sheet').classList.contains('show')) closeSheet(); else if (S.room) closeRoom(); else if (S.route === 'entry' && !typing) closeEntry();
    return; }
  if ((e.metaKey || e.ctrlKey) && e.key === '.') { e.preventDefault(); if (S.room) setFocus(!S.focus); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || S.room) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); const from = S.route === 'entry' ? S.stem : null; openRoom(from, S.route === 'entry' ? $('.keep .ph') : $('.rail .write, .tab-write')); }
  if (e.key === '[' && S.route === 'entry' && !isPhone()) setSidebar(SIDES[(SIDES.indexOf(S.sidebar) + 1) % 3]);
});

/* =======================================================================
   boot and hash routing
   ======================================================================= */
function fromHash() {
  const { route, p } = parseHash();
  const t = p.get('theme'); S.theme = t === 'light' || t === 'dark' ? t : null;
  root.dataset.ink = INKS.some((i) => i[0] === p.get('ink')) ? p.get('ink') : (INKS.some((i) => i[0] === store.get('journal:ink')) ? store.get('journal:ink') : 'blue-black');
  if (p.get('motion') === 'off') root.dataset.motion = 'off'; else delete root.dataset.motion;
  root.dataset.fasten = ['postmark', 'clip', 'tape'].includes(p.get('fasten')) ? p.get('fasten') : 'postmark';
  if (SIDES.includes(p.get('sidebar'))) S.sidebar = p.get('sidebar');
  S.open = new Set((p.get('open') || '').split(',').filter(Boolean));
  if (p.get('stem')) S.stem = p.get('stem');
  S.filt.day = p.get('day') || null; if (S.filt.day) S.month = D(S.filt.day).getMonth();
  S.wk = p.get('week') === 'current' ? 1 : 0;
  if (p.get('focus') === '0') S.focus = false;
  if (p.get('dirty')) { ROWS.prompts[0].v = 8; ROWS.refl[2].v = false; }
  let r = route, write = null;
  if (r === 'write') { write = p.get('from') || 'morning'; r = p.get('over') || (ENTRIES.some((e) => e.stem === write) ? 'entry' : 'today'); if (r === 'entry' && ENTRIES.some((e) => e.stem === write)) S.stem = write; }
  S.route = ['today', 'entries', 'entry', 'insights', 'settings', 'library', 'mark'].includes(r) ? r : 'today';
  if (S.room) { root.classList.add('no-anim'); closeRoom(); room.hidden = true; }
  root.classList.add('no-anim');
  render();
  if (write) openRoom(write === 'note' ? null : write, null, { instant: true, sample: p.get('sample') !== '0', noFocus: true, voice: p.get('rec') === '1' });
  if (p.get('scroll')) setTimeout(() => { const el = $(p.get('scroll')); if (el) el.scrollIntoView({ block: 'start' }); }, 60);
  requestAnimationFrame(() => requestAnimationFrame(() => { root.classList.remove('no-anim'); $$('.seg').forEach(syncSeg); paintMargin(); }));
}
addEventListener('popstate', (ev) => {
  const vt = ev.state?.vt; const back = vt === 'open' ? 'close' : vt === 'push' ? 'pop' : 'fade';
  if (vt) transition(isPhone() && back === 'close' ? 'pop' : back, () => { const { route, p } = parseHash(); S.route = route === 'write' ? (p.get('over') || 'today') : route; if (p.get('stem')) S.stem = p.get('stem'); render(); });
  else fromHash();
});
let lastShape = isPhone() + '|' + mqNarrow.matches;
addEventListener('resize', () => { const sh = isPhone() + '|' + mqNarrow.matches; if (sh !== lastShape) { lastShape = sh; render(); } else { $$('.seg').forEach(syncSeg); paintMargin(); } });
fromHash();

<!doctype html>
<html lang="en" data-theme="light" data-ink="blue-black" data-tod="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>journal — direction C, Almanac</title>
<script>
/* set paper, light and ink before the first paint, so the page never shows another first */
(function(){var h=document.documentElement,q=(location.hash.split("?")[1]||""),p=new URLSearchParams(q);
var dark=matchMedia("(prefers-color-scheme: dark)").matches;h.dataset.theme=p.get("theme")||(dark?"dark":"light");
try{var k=localStorage.getItem("journal:ink");if(k)h.dataset.ink=k}catch(e){}if(p.get("ink"))h.dataset.ink=p.get("ink");
var hr=new Date().getHours();h.dataset.tod=p.get("tod")||(hr<5?"night":hr<10?"dawn":hr<17?"day":hr<21?"dusk":"night");
if(p.get("motion")==="off")h.classList.add("rm");})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ALMANAC — direction C
   Three families: Instrument Serif (the almanac's display, and Ada's voice in
   italic), Newsreader (his words, the body copy), Schibsted Grotesk (interface).
   One hue: her ink. Grounds shift quietly with the time of day.
   ========================================================================== */
:root{
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --text:"Newsreader","Iowan Old Style",Charter,Georgia,serif;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* type scale (px at 1280; phone overrides below) */
  --t-xs:12px; --t-sm:13.5px; --t-ui:15px; --t-his:20px; --t-her:20px;
  --t-lede:27px; --t-h3:34px; --t-h2:48px; --t-h1:96px; --t-num:120px; --t-mega:200px;

  /* space, 4px base */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --margin:clamp(20px,3.4vw,48px); --gutter:clamp(14px,1.9vw,28px); --cols:12;
  --maxw:1320px; --mast:64px; --tab:0px;
  --r1:2px; --r2:4px; --r3:999px;

  /* motion */
  --e-out:cubic-bezier(.16,.84,.24,1);
  --e-io:cubic-bezier(.66,0,.34,1);
  --e-in:cubic-bezier(.5,0,.75,0);
  --d-xs:120ms; --d-s:200ms; --d-m:320ms; --d-l:520ms; --d-xl:720ms; --stagger:45ms;
}
/* ---------- grounds (light), by time of day ---------- */
[data-theme=light]{
  --ground:#f7f5f0; --raised:#fbfaf6; --sunk:#efebe2;
  --ink:#171512; --ink-2:#47423a; --ink-3:#6b6458;
  --rule:#d6cfc2; --rule-2:#e7e2d8; --shade:rgb(40 32 18 / .10);
  --grid:rgb(23 21 18 / .045);
}
[data-theme=light][data-tod=dawn]{--ground:#f8f2ee; --raised:#fcf8f5; --sunk:#f0e7e1; --rule-2:#ebe1da}
[data-theme=light][data-tod=dusk]{--ground:#f4eee4; --raised:#f9f5ee; --sunk:#ebe3d6; --rule-2:#e5dccd}
[data-theme=light][data-tod=night]{--ground:#f1f0ec; --raised:#f8f7f4; --sunk:#e7e5df; --rule-2:#e1dfd8}
/* ---------- grounds (dark) ---------- */
[data-theme=dark]{
  --ground:#121110; --raised:#1a1917; --sunk:#0d0c0b;
  --ink:#ede7dc; --ink-2:#bdb5a8; --ink-3:#928a7d;
  --rule:#36322c; --rule-2:#25221f; --shade:rgb(0 0 0 / .5);
  --grid:rgb(237 231 220 / .04);
}
[data-theme=dark][data-tod=dawn]{--ground:#141317; --raised:#1c1b20}
[data-theme=dark][data-tod=day]{--ground:#151413; --raised:#1d1c1a}
[data-theme=dark][data-tod=dusk]{--ground:#16130f; --raised:#1f1b16}
/* ---------- her inks: the only hue. AA on every ground. ---------- */
[data-theme=light] [data-ink=blue-black],[data-theme=light][data-ink=blue-black]{--her:#28367f}
[data-theme=light] [data-ink=brown],[data-theme=light][data-ink=brown]{--her:#7a4519}
[data-theme=light] [data-ink=violet],[data-theme=light][data-ink=violet]{--her:#4b2a8a}
[data-theme=light] [data-ink=green],[data-theme=light][data-ink=green]{--her:#1b5642}
[data-theme=dark] [data-ink=blue-black],[data-theme=dark][data-ink=blue-black]{--her:#b6c0ff}
[data-theme=dark] [data-ink=brown],[data-theme=dark][data-ink=brown]{--her:#dcab78}
[data-theme=dark] [data-ink=violet],[data-theme=dark][data-ink=violet]{--her:#d2b4ff}
[data-theme=dark] [data-ink=green],[data-theme=dark][data-ink=green]{--her:#8fd3b4}
:root,[data-ink]{--her-soft:color-mix(in srgb,var(--her) 87%,var(--ground)); --her-rule:color-mix(in srgb,var(--her) 38%,var(--ground)); --her-wash:color-mix(in srgb,var(--her) 6%,var(--ground))}

@media (max-width:760px){
  :root{--cols:4; --t-his:19px; --t-her:19px; --t-lede:23px; --t-h3:28px; --t-h2:36px; --t-h1:58px; --t-num:76px; --t-mega:120px; --mast:56px; --tab:68px}
}

*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
html{background:var(--ground); color:var(--ink); -webkit-text-size-adjust:100%; transition:background-color 700ms var(--e-io)}
body{margin:0; color:var(--ink); font:400 var(--t-ui)/1.5 var(--ui); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom)); min-height:100vh}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:var(--r1)}
::selection{background:color-mix(in srgb,var(--ink) 16%,transparent)}
svg.i{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- voices ---------- */
.his{font-family:var(--text); color:var(--ink); font-size:var(--t-his); line-height:1.62; font-optical-sizing:auto}
.hers{font-family:var(--display); font-style:italic; color:var(--her); font-size:var(--t-her); line-height:1.38; transition:color 600ms var(--e-io)}
.hers b,.hers .runin{font-style:normal; font-weight:400}
.who{font:500 var(--t-xs)/1.3 var(--ui); color:var(--her); letter-spacing:.01em; transition:color 600ms}
.who span{color:var(--ink-3); font-weight:400}
.kicker{font:500 var(--t-sm)/1.35 var(--ui); color:var(--ink-3)}
.kicker b{color:var(--ink); font-weight:500}
.num{font-family:var(--display); font-variant-numeric:lining-nums; line-height:.82; letter-spacing:-.015em; font-weight:400}
.tab{font-variant-numeric:tabular-nums}
.hint{font:400 var(--t-sm)/1.45 var(--ui); color:var(--ink-3)}

/* ---------- the grid ---------- */
.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:var(--margin)}
.g{display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); column-gap:var(--gutter)}
.g>*{grid-column:var(--cp,1/-1); min-width:0}
@media (min-width:761px){.g>*{grid-column:var(--c,1/-1)}}
.gridlines{position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0}
.gridlines .wrap{height:100%}
.gridlines .g{height:100%}
.gridlines span{background:color-mix(in srgb,var(--grid) 60%,transparent); border-inline:1px solid var(--grid); transform-origin:top; grid-column:auto}
.gridlines.flash{animation:gridflash 900ms var(--e-io)}
.gridlines.flash span{animation:colwipe 620ms var(--e-out) both; animation-delay:calc(var(--k)*28ms)}
.gridlines.show{opacity:1}
@keyframes gridflash{0%{opacity:0}25%{opacity:.8}100%{opacity:0}}
@keyframes colwipe{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- masthead ---------- */
.mast{position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--ground) 92%,transparent); backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:blur(10px); transition:background-color 700ms}
.mast .wrap{display:flex; align-items:center; height:var(--mast); gap:var(--s6); position:relative}
.mast .wrap::after{content:""; position:absolute; left:var(--margin); right:var(--margin); bottom:0; height:1px; background:var(--ink); transform-origin:left; transition:transform 0ms}
.mast.draw .wrap::after{animation:rule 760ms var(--e-io)}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mark{display:flex; align-items:baseline; gap:var(--s3); text-decoration:none; white-space:nowrap; color:var(--ink)}
.mark .w{font:italic 400 30px/1 var(--display); letter-spacing:-.01em}
.mark .no{font:500 var(--t-xs)/1 var(--ui); color:var(--ink-3)}
.nav{display:flex; gap:var(--s5); margin-left:var(--s4)}
.nav a{font:500 var(--t-ui)/1 var(--ui); color:var(--ink-2); text-decoration:none; padding:23px 0 21px; position:relative}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page]::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--ink)}
.mast .right{margin-left:auto; display:flex; align-items:center; gap:var(--s2)}
.iconbtn{width:44px; height:44px; display:grid; place-items:center; border-radius:var(--r3); color:var(--ink-2)}
.iconbtn:hover{color:var(--ink); background:var(--sunk)}
.btn{display:inline-flex; align-items:center; gap:var(--s2); height:44px; padding:0 var(--s4); border-radius:var(--r2); font:500 var(--t-ui)/1 var(--ui); white-space:nowrap; transition:background-color var(--d-s), transform var(--d-xs)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--ink); color:var(--ground)}
.btn.solid:hover{background:var(--ink-2)}
.btn.line{box-shadow:inset 0 0 0 1px var(--rule); color:var(--ink)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn.quiet{padding:0 var(--s2); color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink)}
.textlink{font:500 var(--t-sm)/1 var(--ui); color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:4px; min-height:44px; display:inline-flex; align-items:center; gap:6px}
.textlink:hover{color:var(--ink); text-decoration-color:var(--ink)}

/* phone tab bar */
.tabbar{display:none}
@media (max-width:760px){
  .nav,.mast .right .btn,.mast .right .hide-phone{display:none}
  .mark .w{font-size:26px}
  .tabbar{display:grid; grid-template-columns:repeat(5,1fr); position:fixed; z-index:45; left:0; right:0; bottom:0; height:calc(var(--tab) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:color-mix(in srgb,var(--ground) 94%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--rule)}
  .tabbar a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font:500 11.5px/1 var(--ui); color:var(--ink-3); text-decoration:none}
  .tabbar a[aria-current=page]{color:var(--ink)}
  .tabbar a[aria-current=page] .lbl{text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px}
  .tabbar .pen{width:48px; height:48px; border-radius:var(--r2); background:var(--ink); color:var(--ground); display:grid; place-items:center; margin:auto}
}

/* ---------- stage + page transitions ---------- */
#stage{min-height:calc(100vh - var(--mast) - var(--tab))}
#stage.out>*{opacity:0; transform:translateY(-8px); transition:opacity 180ms var(--e-in), transform 180ms var(--e-in)}
.rv{opacity:0; transform:translateY(12px)}
.in .rv{opacity:1; transform:none; transition:opacity 480ms var(--e-out), transform 620ms var(--e-out); transition-delay:calc(var(--i,0)*var(--stagger))}
.line-wipe{overflow:hidden; display:block}
.line-wipe>span{display:block; transform:translateY(102%)}
.in .line-wipe>span{transform:none; transition:transform 760ms var(--e-out); transition-delay:calc(var(--i,0)*var(--stagger))}

/* ---------- page heads ---------- */
.pagehead{padding-top:var(--s8); padding-bottom:var(--s6)}
.pagehead h1{font:400 var(--t-h1)/.9 var(--display); letter-spacing:-.025em; margin:0}
.pagehead h1 em{font-style:italic}
.folio{display:flex; justify-content:space-between; align-items:baseline; gap:var(--s4); border-top:1px solid var(--ink); padding-top:var(--s2); margin-top:var(--s5); font:500 var(--t-xs)/1.4 var(--ui); color:var(--ink-3)}
@media (max-width:760px){.pagehead{padding-top:var(--s6); padding-bottom:var(--s5)}}

/* ==========================================================================
   CONTENTS (entries) + ENTRY
   ========================================================================== */
.cl{display:flex; align-items:flex-start; position:relative}
.cl .list{flex:0 0 auto; width:100%; min-width:0; transition:width 560ms var(--e-io)}
.cl .pane{flex:1 1 auto; min-width:0; width:0; overflow:hidden}
.cl .list-in{transition:opacity 200ms var(--e-out)}
.cl.hush .list-in{opacity:0; transition-duration:140ms}
@media (min-width:761px){
  .cl.reading .list{width:17.5rem; position:sticky; top:var(--mast); max-height:calc(100vh - var(--mast)); overflow:auto; scrollbar-width:thin; border-right:1px solid var(--rule); padding-right:var(--s4)}
  .cl.reading .pane{overflow:visible; width:auto; padding-left:clamp(24px,3.5vw,56px)}
}

/* filter sentence */
.lede-filter{font:400 var(--t-lede)/1.3 var(--display); color:var(--ink-2); margin:var(--s5) 0 0; max-width:30ch}
.fword{font:inherit; color:var(--ink); border-bottom:1px dashed var(--ink-3); padding:0 1px; line-height:1.1; position:relative}
.fword:hover{border-bottom-style:solid; border-color:var(--ink)}
.fword[aria-expanded=true]{border-bottom:2px solid var(--ink)}
.search{display:flex; align-items:center; gap:var(--s2); border-bottom:1px solid var(--rule); height:44px; color:var(--ink-3); max-width:20rem; margin-top:var(--s5)}
.search:focus-within{border-color:var(--ink); color:var(--ink)}
.search input{border:0; background:none; font:400 var(--t-ui)/1 var(--ui); color:var(--ink); width:100%; outline:none; height:100%}
.search input::placeholder{color:var(--ink-3)}
.pop{position:absolute; z-index:70; background:var(--raised); border:1px solid var(--rule); border-radius:var(--r2); box-shadow:0 1px 2px var(--shade),0 12px 40px var(--shade); padding:var(--s2) 0; min-width:15rem; transform-origin:top left; animation:pop 200ms var(--e-out)}
@keyframes pop{from{opacity:0; transform:translateY(-4px) scale(.98)}}
.pop button{display:flex; justify-content:space-between; align-items:center; gap:var(--s4); width:100%; text-align:left; padding:0 var(--s4); min-height:44px; font:400 var(--t-ui)/1.2 var(--ui)}
.pop button:hover{background:var(--sunk)}
.pop button .c{color:var(--ink-3); font-size:var(--t-sm)}
.pop button[aria-checked=true]{font-weight:500}

/* the month, almanac-style */
.month{align-self:end; border-top:2px solid var(--ink); padding-top:var(--s3)}
.month .mh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s3)}
.month .mn{font:400 30px/1 var(--display)}
.mg7{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px; text-align:center}
.mg7 b{font:500 var(--t-xs)/2 var(--ui); color:var(--ink-3)}
.mg7 span,.mg7 button{font:400 var(--t-sm)/1 var(--ui); height:34px; display:grid; place-items:center; color:var(--ink-2); font-variant-numeric:tabular-nums}
.mg7 .fut{color:color-mix(in srgb,var(--ink-3) 55%,var(--ground))}
.mg7 button.on,.mg7 button.td{color:var(--ink); font-weight:600; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:5px}
.mg7 button:hover{background:var(--sunk); border-radius:var(--r1)}
.mg7 .td{position:relative}
.mg7 .td::after{content:""; position:absolute; inset:2px 6px; border:1px solid var(--ink); border-radius:50%}
.cl.compact .month{display:none}
@media (max-width:760px){.month{display:none}}

/* weeks + days (full contents) */
.week{margin-top:var(--s7)}
.weekhead{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4); border-top:2px solid var(--ink); padding-top:var(--s3); padding-bottom:var(--s2)}
.weekhead h2{font:400 var(--t-h3)/1 var(--display); margin:0; letter-spacing:-.01em}
.weekhead .kicker{text-align:right}
.day{border-top:1px solid var(--rule); padding:var(--s5) 0; row-gap:var(--s4)}
.day:first-of-type{border-top:0}
.dnum{--c:1/3; --cp:1/2; display:flex; flex-direction:column; gap:var(--s2)}
.dnum .num{font-size:var(--t-num)}
.dnum .kicker{padding-left:4px}
.dentries{--c:3/13; --cp:2/5; display:flex; flex-direction:column}
.erow{display:grid; grid-template-columns:5rem minmax(0,1fr) 12rem; column-gap:var(--gutter); text-align:left; width:100%; padding:var(--s3) 0 var(--s4); border-top:1px solid var(--rule-2); position:relative; transition:opacity 200ms}
.erow:first-child{border-top:0; padding-top:var(--s1)}
.erow .t{font:500 var(--t-sm)/2.3 var(--ui); color:var(--ink-3)}
.erow .prac{font:500 var(--t-sm)/1.3 var(--ui); color:var(--ink-2); margin-bottom:6px; display:block}
.erow .hl{font:400 32px/1.14 var(--text); font-optical-sizing:auto; letter-spacing:-.012em; color:var(--ink); display:block; text-wrap:balance; transition:color 200ms}
.erow:hover .hl{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:6px; text-decoration-color:var(--rule)}
.erow .meta{font:400 var(--t-sm)/1.5 var(--ui); color:var(--ink-3); text-align:right; padding-top:4px}
.erow .meta .her{color:var(--her)}
.erow .meta>span{display:block}
.dnum .sh{display:none}
.dayref{margin-top:var(--s3); padding-top:var(--s3); border-top:1px dashed var(--her-rule); display:grid; grid-template-columns:5rem minmax(0,1fr); column-gap:var(--gutter); text-align:left; width:100%}
.dayref .hers{font-size:21px}
.dayref .who{line-height:2.2}

@media (max-width:760px){
  .dnum .num{font-size:56px}
  .dnum{gap:4px}
  .dnum .kicker{padding-left:2px; font-size:var(--t-xs)}
  .day{column-gap:var(--s4); grid-template-columns:52px minmax(0,1fr)}
  .day .dnum{grid-column:1} .day .dentries{grid-column:2}
  .erow{grid-template-columns:1fr; padding:var(--s2) 0 var(--s4)}
  .erow .t{display:none}
  .erow .hl{font-size:23px; line-height:1.2}
  .erow .meta{text-align:left; padding-top:6px}
  .erow .meta>span{display:inline}
  .erow .meta>span+span::before{content:" · "; color:var(--ink-3)}
  .dnum .lg{display:none} .dnum .sh{display:inline}
  .dayref{grid-template-columns:1fr}
  .dayref .who{line-height:1.6}
  .weekhead h2{font-size:30px}
}

/* compact contents (the index column) */
.cl.compact .pagehead{padding-top:var(--s6); padding-bottom:var(--s3); display:block}
.day{scroll-margin-top:calc(var(--mast) + 16px)}
.cl.compact .pagehead h1{font-size:40px}
.cl.compact .lede-filter,.cl.compact .search,.cl.compact .folio .r{display:none}
.cl.compact .week{margin-top:var(--s5)}
.cl.compact .weekhead h2{font-size:22px}
.cl.compact .weekhead .kicker{display:none}
.cl.compact .day{grid-template-columns:2.6rem minmax(0,1fr); column-gap:var(--s3); padding:var(--s3) 0}
.cl.compact .dnum{grid-column:1}
.cl.compact .dentries{grid-column:2}
.cl.compact .dnum .num{font-size:34px}
.cl.compact .dnum .kicker{display:none}
.cl.compact .erow{grid-template-columns:1fr; padding:var(--s2) var(--s2) var(--s2) 0; border-top:0}
.cl.compact .erow .t,.cl.compact .erow .meta,.cl.compact .dayref{display:none}
.cl.compact .erow .prac{font-size:var(--t-xs); margin-bottom:2px; color:var(--ink-3)}
.cl.compact .erow .hl{font-size:16px; line-height:1.3; letter-spacing:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.cl.compact .erow[aria-current=true]::before{content:""; position:absolute; left:-12px; top:10px; bottom:10px; width:3px; background:var(--ink)}
.cl.compact .erow[aria-current=true] .hl{font-weight:500}
.cl.compact .erow:not([aria-current=true]) .hl{color:var(--ink-2)}

/* phone push */
@media (max-width:760px){
  .cl{display:grid; grid-template-columns:minmax(0,1fr)}
  .cl .list,.cl .pane{grid-area:1/1; width:100%; min-width:0}
  .cl .pane{overflow:visible; transform:translateX(100%); visibility:hidden}
  .cl.reading .pane{transform:none; visibility:visible}
  .cl.reading .list{transform:translateX(-28%); opacity:0}
  .cl.anim .pane{transition:transform 460ms var(--e-io), visibility 0s}
  .cl.anim .list{transition:transform 460ms var(--e-io), opacity 460ms var(--e-io)}
  .cl.gone .list{display:none}
  .cl.compact .pagehead h1{font-size:var(--t-h1)}
}

/* ---------- the entry document ---------- */
.doc{--mg:5.75rem; --hc:minmax(0,35rem); --nc:minmax(12rem,16rem); display:grid; grid-template-columns:var(--mg) var(--hc) var(--nc); column-gap:clamp(20px,2.6vw,40px); padding-bottom:var(--s9)}
.doc>*{grid-column:2}
.doc .full{grid-column:1/-1}
.doc .mg{grid-column:1}
.doc .nt{grid-column:3}
.back{display:inline-flex; align-items:center; gap:6px; font:500 var(--t-sm)/1 var(--ui); color:var(--ink-2); min-height:44px; margin-top:var(--s4)}
.back:hover{color:var(--ink)}
.dochead{grid-column:1/-1; display:grid; grid-template-columns:subgrid; padding-top:var(--s5); align-items:end}
.dochead .mg{display:flex; flex-direction:column; gap:6px}
.dochead .mg .num{font-size:96px; margin-left:-4px}
.dochead h1{font:400 64px/.95 var(--display); letter-spacing:-.02em; margin:0 0 6px}
.dochead .acts{grid-column:3; justify-self:end; display:flex; gap:var(--s1); align-self:start}
.docrule{grid-column:1/-1; height:1px; background:var(--ink); margin:var(--s5) 0 var(--s6)}
.standfirst{margin:0 0 var(--s3)}
.standfirst .hers{font-size:var(--t-lede); line-height:1.25}
.qfold{margin:var(--s2) 0 var(--s7); grid-column:2/4 !important}
.qfold .foldbtn{max-width:35rem}
.foldbtn{display:flex; align-items:center; gap:var(--s3); min-height:44px; width:100%; text-align:left; border-top:1px dashed var(--her-rule); border-bottom:1px dashed var(--her-rule); padding:var(--s2) 0}
.foldbtn .lbl{font:500 var(--t-sm)/1.3 var(--ui); color:var(--her); transition:color 600ms}
.foldbtn .lbl span{color:var(--ink-3); font-weight:400}
.foldbtn .chev{margin-left:auto; color:var(--her); transition:transform 420ms var(--e-io)}
[data-open=true]>.foldbtn .chev,[data-open=true]>.dept-h .chev{transform:rotate(180deg)}
.fold-b{display:grid; grid-template-rows:0fr; transition:grid-template-rows 520ms var(--e-io)}
[data-open=true]>.fold-b{grid-template-rows:1fr}
.fold-i{min-height:0; overflow:hidden}
.fold-i>*{opacity:0; transform:translateY(10px); transition:opacity 160ms var(--e-in), transform 220ms var(--e-in)}
[data-open=true]>.fold-b>.fold-i>*{opacity:1; transform:none; transition:opacity 420ms var(--e-out), transform 560ms var(--e-out); transition-delay:calc(140ms + var(--i,0)*55ms)}
.qsets{columns:2 16rem; column-gap:var(--s7); padding:var(--s5) 0 var(--s3); column-rule:1px solid var(--rule-2)}
.qset{break-inside:avoid; margin-bottom:var(--s5)}
.qset h4{font:500 var(--t-xs)/1.3 var(--ui); color:var(--ink-3); margin:0 0 var(--s2)}
.qset ol{list-style:none; margin:0; padding:0}
.qset li{display:grid; grid-template-columns:2.2rem 1fr; padding:3px 0}
.qset li .id{font:400 var(--t-xs)/1.9 var(--ui); color:var(--ink-3)}
.qset li .hers{font-size:18px; color:var(--her-soft)}
.qset li.asked .hers{color:var(--her)}
.qset li.asked .tag{display:block; font:500 11.5px/1.4 var(--ui); color:var(--her); font-style:normal}

/* blocks */
.blk{display:contents}
.blk>.mg{padding-top:7px; text-align:right; position:relative}
.blk .tm{font:500 var(--t-sm)/1.3 var(--ui); color:var(--ink-3); display:block}
.blk .src{font:400 var(--t-xs)/1.4 var(--ui); color:var(--ink-3); display:block}
.blk .body{padding-bottom:var(--s6); position:relative}
.blk .body p{margin:0 0 .7em}
.blk .body p:last-child{margin-bottom:0}
.acts-bar{display:flex; flex-direction:column; align-items:flex-end; gap:0; margin-top:var(--s2); opacity:0; transform:translateX(6px); transition:opacity 180ms, transform 240ms var(--e-out); pointer-events:none}
.acts-bar button{display:inline-flex; align-items:center; gap:6px; font:500 var(--t-xs)/1 var(--ui); color:var(--ink-2); min-height:32px; padding:0 2px}
.acts-bar button:hover{color:var(--ink)}
.acts-bar button svg{width:15px; height:15px}
@media (hover:hover){.blk:hover .acts-bar,.blk:focus-within .acts-bar{opacity:1; transform:none; pointer-events:auto}}
.blk.held .acts-bar{opacity:1; transform:none; pointer-events:auto}
.blk.held .body .his{background:color-mix(in srgb,var(--ink) 5%,transparent); border-radius:var(--r1); box-shadow:0 0 0 6px color-mix(in srgb,var(--ink) 5%,transparent)}
.replyto{display:flex; gap:var(--s2); align-items:baseline; font:400 var(--t-sm)/1.4 var(--ui); color:var(--ink-3); margin-bottom:var(--s2)}
.replyto .hers{font-size:16px; color:var(--her-soft)}
.note{padding-top:9px; padding-bottom:var(--s5); border-top:1px dashed var(--her-rule); align-self:start}
.note .who{display:block; margin-bottom:4px}
.note .hers{font-size:18px; line-height:1.35}
.note.her-turn{grid-column:3}
.confirm{display:flex; align-items:center; gap:var(--s3); margin-top:var(--s3); font:400 var(--t-sm)/1.3 var(--ui); color:var(--ink-2)}
.editbox{width:100%; border:0; border-bottom:1px solid var(--ink); background:transparent; resize:none; outline:none; padding:0 0 var(--s2); display:block}
.edit-acts{display:flex; gap:var(--s2); margin-top:var(--s2)}

/* audio */
.player{display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:var(--s3); margin-bottom:var(--s3)}
.play{width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--ground); display:grid; place-items:center; transition:transform var(--d-xs)}
.play:active{transform:scale(.94)}

.ptime{font:500 var(--t-sm)/1 var(--ui); color:var(--ink-3); font-variant-numeric:tabular-nums; display:flex; gap:var(--s2); align-items:center}
.ptime button{font:500 var(--t-xs)/1 var(--ui); color:var(--ink-2); min-width:36px; min-height:32px; border-radius:var(--r1); box-shadow:inset 0 0 0 1px var(--rule)}

/* departments: analysis, reflection */
.dept{border-top:1px solid var(--ink); margin-top:var(--s4)}
.dept+.dept{border-top-color:var(--rule)}
.dept-h{display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:var(--s3); width:100%; text-align:left; min-height:64px; padding:var(--s4) 0}
.dept-h h3{font:400 var(--t-h3)/1 var(--display); margin:0; letter-spacing:-.01em}
.dept-h .kicker{grid-column:1; margin-top:2px}
.dept-h .chev{grid-column:2; grid-row:1; color:var(--ink-2); transition:transform 420ms var(--e-io)}
.dept-body{padding:var(--s2) 0 var(--s6)}
.dept-body ul{margin:0; padding:0; list-style:none}
.dept-body li{position:relative; padding-left:1.4em; margin-bottom:var(--s3)}
.dept-body li::before{content:"—"; position:absolute; left:0; color:var(--her-soft); font-style:normal}
.dept-body p{margin:0 0 var(--s3)}
.dept-body .src{margin-top:var(--s4)}
.compose-line{grid-column:2; margin-top:var(--s7); display:flex; align-items:center; gap:var(--s4); border-top:1px solid var(--rule); padding-top:var(--s4)}
.compose-line .ph{flex:1; text-align:left; font:italic 400 var(--t-his)/1.4 var(--text); color:var(--ink-3); min-height:44px}
.compose-line .ph:hover{color:var(--ink-2)}

@media (max-width:1100px) and (min-width:761px){
  .doc{--mg:4.5rem; --nc:minmax(10rem,13rem)}
}
@media (max-width:760px){
  .doc{display:block}
  .dochead{display:block; padding-top:var(--s2)}
  .dochead .mg{flex-direction:row; align-items:baseline; gap:var(--s3); margin-bottom:var(--s2)}
  .dochead .mg .num{font-size:64px}
  .dochead h1{font-size:44px}
  .dochead .acts{display:none}
  .docrule{margin:var(--s4) 0 var(--s5)}
  .blk>.mg{text-align:left; padding:0 0 var(--s1); display:flex; gap:var(--s2); align-items:baseline}
  .blk .tm,.blk .src{display:inline}
  .blk .src::before{content:"· "}
  .acts-bar{position:absolute; right:0; top:-6px; flex-direction:row; gap:var(--s3); margin:0; background:var(--raised); border:1px solid var(--rule); border-radius:var(--r2); padding:0 var(--s3); box-shadow:0 8px 24px var(--shade)}
  .acts-bar button{min-height:44px; font-size:var(--t-sm)}
  .note{margin:0 0 var(--s6) var(--s5); padding-bottom:0}
  .compose-line{margin-top:var(--s6)}
  .player{grid-template-columns:44px 1fr; row-gap:6px}
  .ptime{grid-column:2; justify-content:space-between}
  .week{margin-top:var(--s5)}
  .pagehead{padding-bottom:var(--s3)}
  .qsets{columns:1}
}

/* ==========================================================================
   WRITE — the room
   ========================================================================== */
.room{position:fixed; inset:0; z-index:90; background:var(--raised); display:grid; grid-template-rows:auto 1fr auto; clip-path:inset(0 0 100% 0); visibility:hidden; transition:background-color 700ms}
.room.open{clip-path:inset(0 0 0 0); visibility:visible; transition:clip-path 640ms var(--e-io), visibility 0s}
.room.closing{clip-path:inset(0 0 100% 0); visibility:visible; transition:clip-path 460ms var(--e-io) 120ms}
.room .rtop,.room .rfoot{transition:opacity 400ms var(--e-io)}
.rtop{display:flex; align-items:center; gap:var(--s4); height:64px; padding:0 var(--margin); border-bottom:1px solid var(--rule-2)}
.rtop .fol{font:500 var(--t-sm)/1.2 var(--ui); color:var(--ink-3); flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.saved .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-3); transition:background-color 200ms, transform 200ms}

@keyframes breathe{50%{transform:scale(.5)}}
.rscroll{overflow:auto; scroll-padding:30vh}
.rpage{max-width:40rem; margin:0 auto; padding:clamp(40px,9vh,112px) var(--margin) 30vh}
.rprompt .who{display:block; margin-bottom:var(--s3)}
.rprompt .hers{font-size:clamp(28px,3.1vw,38px); line-height:1.18; text-wrap:balance; transition:opacity 500ms var(--e-io), color 600ms}
.rprompt .more{margin-top:var(--s3)}
.rrule{height:1px; background:var(--ink); margin:var(--s6) 0 var(--s6); transform-origin:left}
.rnotes{display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s4)}
.rnote{display:flex; align-items:center; gap:var(--s3); font:400 var(--t-sm)/1.3 var(--ui); color:var(--ink-2); padding:var(--s2) 0; border-bottom:1px solid var(--rule-2); animation:pop 300ms var(--e-out)}
.rnote .mini{display:flex; gap:2px; align-items:center; height:18px; width:90px}
.rnote .mini i{flex:1; background:var(--ink-3); border-radius:1px}
textarea.rtext{width:100%; border:0; outline:none; background:transparent; resize:none; font-family:var(--text); font-size:clamp(20px,1.9vw,23px); line-height:1.65; color:var(--ink); caret-color:var(--ink); padding:0; min-height:40vh; font-optical-sizing:auto}

.rfoot{display:flex; align-items:center; gap:var(--s4); height:76px; padding:0 var(--margin) env(safe-area-inset-bottom); border-top:1px solid var(--rule-2)}
.rec{display:flex; align-items:center; gap:var(--s3); height:48px; padding:0 var(--s4) 0 6px; border-radius:var(--r3); box-shadow:inset 0 0 0 1px var(--rule); font:500 var(--t-sm)/1 var(--ui)}
.rec .mic{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--sunk)}
.rec.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rec.on .mic{background:var(--ink); color:var(--ground)}
.rec .lv{display:none; gap:2px; height:18px; align-items:center}
.rec.on .lv{display:flex}
.rec .lv i{width:2px; background:var(--ink); border-radius:1px; height:30%; animation:lv 700ms ease-in-out infinite alternate}
@keyframes lv{to{height:100%}}
.count{font:400 var(--t-sm)/1 var(--ui); color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
#keepbtn .sh{display:none}
.rfoot .sp{flex:1}
.room.focus .rtop,.room.focus .rfoot{opacity:0; pointer-events:none}
.room.focus .rtop:hover,.room.focus .rfoot:hover{opacity:1; pointer-events:auto}
.room.focus .rprompt .hers{opacity:.32}
.room.focus .rprompt .more,.room.focus .rprompt .who{opacity:0}
.focushint{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font:400 var(--t-xs)/1 var(--ui); color:var(--ink-3); opacity:0; transition:opacity 400ms; pointer-events:none}
.room.focus .focushint{opacity:1; transition-delay:600ms}
.room .rv{opacity:0; transform:translateY(14px)}
.room.open .rv{opacity:1; transform:none; transition:opacity 520ms var(--e-out), transform 700ms var(--e-out); transition-delay:calc(260ms + var(--i,0)*70ms)}
.room .rrule{transform:scaleX(0)}
.room.open .rrule{transform:scaleX(1); transition:transform 900ms var(--e-io) 380ms}
@media (max-width:760px){
  .rtop{height:56px; gap:var(--s2)}
  .rtop .fol{text-align:left}
  .saved{min-width:auto}
  .saved .txt{display:none}
  .rpage{padding-top:var(--s6)}
  .rfoot{height:68px; gap:var(--s3)}

  .rec.on .rlbl{display:inline}
  #keepbtn .lg{display:none} #keepbtn .sh{display:inline}
  .rec{padding:0 6px}
}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(var(--tab) + 20px); z-index:95; transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--ground); font:500 var(--t-sm)/1.3 var(--ui); padding:var(--s3) var(--s4); border-radius:var(--r2); transition:opacity 260ms, transform 360ms var(--e-out); pointer-events:none; max-width:calc(100vw - 40px)}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ==========================================================================
   TODAY (the cover)
   ========================================================================== */
.cover{padding-top:var(--s7); row-gap:var(--s6)}
.cover .bigday{--c:1/6; display:flex; align-items:flex-end; gap:var(--s4)}

  .slot{grid-template-columns:1fr; row-gap:var(--s2)}
  .slot>.num{grid-column:1; font-size:44px}

  .slot.quiet .what h3{font-size:24px}
}

/* ==========================================================================
   INSIGHTS — the week as a spread
   ========================================================================== */
.spread-head{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s5); padding-top:var(--s7)}
.spread-head h1{font:400 var(--t-h1)/.88 var(--display); letter-spacing:-.025em; margin:0}

.spread{row-gap:0; margin-top:var(--s5); border-top:2px solid var(--ink)}

.fig.big .num{font-size:var(--t-mega)}

.d7 .fl{font:400 13px/1.3 var(--text); color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.d7.none .num{color:var(--ink-3)}
.d7.today::after{content:"today"; position:absolute; top:var(--s4); right:var(--s3); font:500 var(--t-xs)/1 var(--ui); color:var(--ink-3)}
.word{--c:1/5; padding:var(--s7) var(--s5) var(--s7) 0; border-right:1px solid var(--rule)}
.word .w{font:400 clamp(56px,6vw,84px)/1 var(--text); letter-spacing:-.03em; display:block; margin:var(--s3) 0 var(--s2); font-optical-sizing:auto}
.word .x{font:400 var(--t-sm)/1.4 var(--ui); color:var(--ink-2)}
.word .line{margin-top:var(--s6); padding-top:var(--s4); border-top:1px solid var(--rule)}
.word .line .his{font-size:24px; line-height:1.35; display:block; margin-top:var(--s2)}
.review{--c:5/12; padding:var(--s7) 0 var(--s7) var(--gutter)}
.review h2{font:400 var(--t-h2)/1.02 var(--display); margin:var(--s3) 0 var(--s5); letter-spacing:-.015em; max-width:16ch}

.dispatch{--c:1/13; border-top:2px solid var(--ink); padding-top:var(--s3); margin-top:0}

.disp{border-top:1px solid var(--rule)}

/* ==========================================================================
   LIBRARY
   ========================================================================== */
.libsec{margin-top:var(--s7)}

/* switch */
.sw{position:relative; width:52px; height:44px; flex:none; display:inline-grid; place-items:center}

.glance{align-self:end; border-top:2px solid var(--ink); padding-top:var(--s3)}

.textin{font:400 var(--t-ui)/1 var(--ui); color:var(--ink); background:none; border:0; border-bottom:1px solid var(--rule); height:40px; text-align:right; width:12rem; outline:none}
.textin:focus{border-color:var(--ink)}
@media (max-width:760px){

  .checks li{grid-template-columns:18px 1fr}

(() => {
"use strict";
/* ---------------------------------------------------------------- data (neutral fixtures) */

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function parseHash(){
  const raw = location.hash.replace(/^#/, "") || "today";

function hashFor(screen, extra={}){

  for (const k of ["theme","ink","tod"]) if (S.params[k]) keep[k] = S.params[k];

  const q = new URLSearchParams(keep).toString();
  return "#" + screen + (q ? "?" + q : "");
}

let current = null;
async function route(first){
  const {screen, p} = parseHash();
  S.params = p;
  if (p.theme === "dark" || p.theme === "light") S.theme = p.theme;
  if (p.ink && ["blue-black","brown","violet","green"].includes(p.ink)) S.ink = p.ink;
  if (p.tod && ["dawn","day","dusk","night"].includes(p.tod)) S.tod = p.tod;
  if (p.motion === "off") document.documentElement.classList.add("rm");
  applyLook();

  if (screen === "write"){
    if (!current){ await show("today", {}, true); }
    openRoom({prompt: "morning"});
    return;
  }
  if (S.room.open) closeRoom(true);

  const fam = s => (s === "entries" || s === "entry") ? "contents" : s;
  const stem = screen === "entry" ? (p.stem || "2026-10-14-evening") : null;
  if (current && fam(current) === "contents" && fam(screen) === "contents"){
    current = screen; markNav(screen);
    return setReading(stem);
  }
  await show(screen, {stem}, first);
}

      window.scrollTo({top:listScroll, behavior:"instant"});
      await wait(470); cl.classList.remove("anim"); pane.innerHTML = "";

}

function waveBars(seed, n=72){
  let out = "";

    const v = 0.22 + 0.78*Math.abs(Math.sin(k*0.37+seed)*Math.cos(k*0.11+seed*2)) * (0.6+0.4*Math.sin(k*1.7));
    out += `<i style="height:${Math.max(12, Math.round(v*100))}%"></i>`;
  }
  return out;
}

function prow(p, kind){

    side = `<div class="side">${p.at ? `<button class="btn solid" data-act="toast" data-msg="Session 2 opens">Continue</button>` : `<button class="btn line" data-act="toast" data-msg="Starts with session 1">Start</button>`}</div>`;

function placeThumbs(root=document){

/* ---------------------------------------------------------------- after render */
let scrollSpy = null;
function after(screen, stem){
  if (screen === "settings"){
    requestAnimationFrame(() => placeThumbs());
    document.fonts && document.fonts.ready.then(() => placeThumbs());
    if (scrollSpy) scrollSpy.disconnect();
    scrollSpy = new IntersectionObserver(es => {
      es.forEach(en => { if (en.isIntersecting){ const id = en.target.id.slice(2); $$(".sindex a").forEach(a => a.dataset.id === id ? a.setAttribute("aria-current","true") : a.removeAttribute("aria-current")); } });
    }, {rootMargin:"-30% 0px -60% 0px"});
    $$(".ssec").forEach(s => scrollSpy.observe(s));
  }
  if (screen === "entries" || screen === "entry"){
    const q = $("#q");
    q && q.addEventListener("input", () => { S.filter.q = q.value; refreshList(); });
  }
  $$(".fold-i").forEach(fi => [...fi.children].forEach((c,k) => c.style.setProperty("--i", k)));
  
}
function refreshList(){
  const cl = $("#cl"); if (!cl) return;
  const cur = $(".erow[aria-current=true]");
  $("#weeks").innerHTML = listHTML(cur ? cur.dataset.stem : null);
  const lf = $(".lede-filter", cl); if (lf){ const t = document.createElement("div"); t.innerHTML = filterSentence(); lf.replaceWith(t.firstElementChild); }
  $$("#cl .rv").forEach(el => el.style.transitionDelay = "0ms");
}

/* ---------------------------------------------------------------- folds */
function toggleFold(btn){
  const box = btn.parentElement;
  const open = box.dataset.open !== "true";
  box.dataset.open = String(open);
  btn.setAttribute("aria-expanded", String(open));
}

/* ---------------------------------------------------------------- audio (simulated) */
let playing = null;
function playToggle(btn){
  const pl = btn.closest(".player"), dur = +pl.dataset.dur;
  if (playing && playing.pl === pl){ cancelAnimationFrame(playing.raf); playing = null; btn.innerHTML = I.play; btn.setAttribute("aria-label","Play the voice note"); return; }
  if (playing){ cancelAnimationFrame(playing.raf); $(".play", playing.pl).innerHTML = I.play; }
  btn.innerHTML = I.pause; btn.setAttribute("aria-label","Pause");
  const speed = () => parseFloat($(".ptime button", pl).textContent) || 1;
  let t = +(pl.dataset.t || 0), last = performance.now();
  paint(pl, t);
  const tick = now => {
    t += Math.max(0, now - last) / 1000 * speed() * 6; last = now; // demo runs six times faster than life
    if (t >= dur){ t = 0; paint(pl, 0); playing = null; btn.innerHTML = I.play; return; }
    paint(pl, t); playing.raf = requestAnimationFrame(tick);
  };
  playing = {pl, raf: requestAnimationFrame(tick)};
}
function paint(pl, t){
  const dur = +pl.dataset.dur; pl.dataset.t = t;
  const bars = $$(".wave i", pl), n = Math.round(t / dur * bars.length);
  bars.forEach((b,k) => b.classList.toggle("on", k < n));
  $(".cur", pl).textContent = fmt(t);
  $(".wave", pl).setAttribute("aria-valuenow", Math.round(t));
}

/* ---------------------------------------------------------------- WRITE room */
const PROMPTS = {
  morning:{fol:"<b>Morning journal</b> · Thursday 15 October", who:"Ada · sent 06:00", text:"Morning. Start wherever something feels alive — one line or a voice note is plenty.", more:"11 questions if you want them: how you slept, what's on your chest, the one thing that would make today deeply satisfying."},
  "evening-add":{fol:"Adding to <b>Evening journal</b> · Wednesday 14 October", who:"Ada · 23:45, in the chat", text:"The harbour sounds like a word you keep for somewhere safe. What made you think of it tonight?", more:""},
  add:{fol:"Adding to this entry", who:"", text:"", more:""},
  free:{fol:"<b>A note</b> · Thursday 15 October, 09:14", who:"", text:"", more:""},
  "before-talk":{fol:"<b>Before a hard conversation</b>", who:"Ada · just now", text:"Before you go in: what do you want to be true when it's over?", more:"Five questions; take the first and see."},
  tide:{fol:"<b>Low tide</b> · your own practice", who:"From your practice", text:"What is far out tonight? What is still close?", more:""},
};
let lastFocus = null, saveT = null, recI = null;
function openRoom({prompt="free", rec=false}={}){
  const P = PROMPTS[prompt] || PROMPTS.free;
  const room = $("#room");
  lastFocus = document.activeElement;
  $("#rfol").innerHTML = P.fol;
  $("#rprompt").innerHTML = P.text
    ? `<span class="who rv" style="--i:0">${P.who.replace("Ada","Ada <span>").replace(/$/,"</span>")}</span><div class="hers rv" style="--i:1">${esc(P.text)}</div>${P.more?`<p class="hint more rv" style="--i:2">${esc(P.more)}</p>`:""}`
    : `<span class="kicker rv" style="--i:0">Your own words, no prompt</span><div class="rv" style="--i:1;font:400 clamp(34px,4vw,52px)/1 var(--display);margin-top:8px">Thursday, <em>the 15th</em></div>`;
  room.classList.remove("closing","focus");
  room.setAttribute("aria-hidden","false");
  S.room.open = true; S.room.from = prompt;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { room.classList.add("open"); });
  setTimeout(() => $("#rtext").focus({preventScroll:true}), mm.matches ? 0 : 520);
  if (rec) setTimeout(() => toggleRec(), 600);
}
function closeRoom(silent){
  const room = $("#room");
  if (!S.room.open) return;
  if (S.room.recording) toggleRec();
  S.room.open = false;
  room.classList.add("closing"); room.classList.remove("open","focus");
  room.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  setTimeout(() => room.classList.remove("closing"), mm.matches ? 0 : 640);
  if (!silent && parseHash().screen === "write") history.replaceState(null, "", hashFor(current || "today"));
  lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
}
function countWords(){
  const v = $("#rtext").value.trim();
  const n = v ? v.split(/\s+/).length : 0;
  $("#count").textContent = `${n} ${n===1?"word":"words"}${S.room.notes.length ? ` · ${S.room.notes.length} spoken` : ""}`;
  const sv = $("#saved");
  sv.classList.add("saving"); $(".txt", sv).textContent = "Keeping…";
  clearTimeout(saveT);
  saveT = setTimeout(() => { sv.classList.remove("saving"); $(".txt", sv).textContent = "Kept on this device"; }, 700);
  const ta = $("#rtext"); ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight, window.innerHeight*0.4) + "px";
}
function toggleRec(){
  const b = $("#rec");
  S.room.recording = !S.room.recording;
  b.classList.toggle("on", S.room.recording); b.setAttribute("aria-pressed", String(S.room.recording));
  if (S.room.recording){
    S.room.recT = 0; $("#reclbl").textContent = "0:00 · tap to stop";
    recI = setInterval(() => { S.room.recT++; $("#reclbl").textContent = fmt(S.room.recT) + " · tap to stop"; }, 1000);
  } else {
    clearInterval(recI); $("#reclbl").textContent = "Record";
    const secs = Math.max(S.room.recT, 4);
    S.room.notes.push(secs);
    const n = document.createElement("div"); n.className = "rnote";
    n.innerHTML = `<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/></svg><span class="mini">${Array.from({length:22},(_,k)=>`<i style="height:${25+Math.round(70*Math.abs(Math.sin(k*1.3+secs)))}%"></i>`).join("")}</span><span>Voice note, ${fmt(secs)} · its words will follow</span>`;
    $("#rnotes").appendChild(n); countWords();
  }
}

/* ---------------------------------------------------------------- toast */
let toastT = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------------------------------------------------------------- popover menu (filters) */
let openPop = null;
function closePop(){ if (openPop){ openPop.el.remove(); openPop.btn.setAttribute("aria-expanded","false"); openPop = null; } }
function filterMenu(btn){
  if (openPop && openPop.btn === btn){ closePop(); return; }
  closePop();
  const k = btn.dataset.k, opts = FWORDS[k];
  const el = document.createElement("div"); el.className = "pop"; el.setAttribute("role","menu");
  const counts = key => { const keep = S.filter[k]; S.filter[k] = key; const n = filtered().length; S.filter[k] = keep; return n; };
  el.innerHTML = Object.entries(opts).map(([key, label]) => `<button role="menuitemradio" aria-checked="${S.filter[k]===key}" data-act="fpick" data-k="${k}" data-v="${key}"><span>${label}</span><span class="c">${counts(key)}</span></button>`).join("");
  document.body.appendChild(el);
  const r = btn.getBoundingClientRect();
  el.style.left = Math.min(r.left + window.scrollX, window.innerWidth - el.offsetWidth - 16) + "px";
  el.style.top = (r.bottom + window.scrollY + 8) + "px";
  btn.setAttribute("aria-expanded","true");
  openPop = {el, btn};
  $("button", el).focus({preventScroll:true});
}

/* ---------------------------------------------------------------- events */
document.addEventListener("click", e => {
  const link = e.target.closest("[data-go]");
  if (link && !e.target.closest("[data-act]")){ e.preventDefault(); closePop(); return goTo(link.dataset.go); }
  const a = e.target.closest("[data-act]");
  if (openPop && !e.target.closest(".pop") && !(a && a.dataset.act === "fmenu")) closePop();
  if (!a){ $$(".blk.held").forEach(b => b.classList.remove("held")); return; }
  const act = a.dataset.act;
  switch (act){
    case "write": e.preventDefault(); openRoom({prompt: a.dataset.prompt || "free", rec: !!a.dataset.rec}); break;
    case "close-room": closeRoom(); break;
    case "focus": { const r = $("#room"); r.classList.toggle("focus"); a.setAttribute("aria-pressed", r.classList.contains("focus")); $("#rtext").focus(); break; }
    case "record": toggleRec(); break;
    case "keep": {
      const n = $("#rtext").value.trim();
      if (!n && !S.room.notes.length){ toast("Nothing to keep yet"); break; }
      closeRoom(); $("#rtext").value = ""; $("#rnotes").innerHTML = ""; S.room.notes = []; countWords();
      setTimeout(() => toast("Kept in Thursday's entry, in your words"), 500); break;
    }
    case "theme": S.theme = S.theme === "light" ? "dark" : "light"; S.params.theme = S.theme; applyLook(); history.replaceState(null,"",hashFor(current==="entry"?"entry":current||"today", current==="entry"?{stem:$(".erow[aria-current=true]")?.dataset.stem||""}:{})); placeThumbs(); break;
    case "theme-set": S.theme = a.dataset.v; S.params.theme = S.theme; applyLook(); setPressed(a); break;
    case "tod-set": S.tod = a.dataset.v; S.params.tod = S.tod; applyLook(); setPressed(a); break;
    case "open": e.preventDefault(); go("entry", {stem:a.dataset.stem}); break;
    case "close-entry": go("entries"); break;
    case "go-insights": go("insights"); break;
    case "go-entries": go("entries"); break;
    case "fold": toggleFold(a); break;
    case "review": { const box = $("#rev"); const open = box.dataset.open !== "true"; box.dataset.open = String(open); a.setAttribute("aria-expanded", String(open)); a.innerHTML = open ? "Fold the review" : 'Read the whole review <span class="hint" style="font-style:normal">· three more paragraphs</span>'; break; }
    case "fmenu": filterMenu(a); break;
    case "fpick": S.filter[a.dataset.k] = a.dataset.v; closePop(); refreshList(); break;
    case "fclear": S.filter = {practice:"all", media:"any", q:""}; const q = $("#q"); if (q) q.value = ""; refreshList(); break;
    case "play": playToggle(a); break;
    case "speed": { const s = {"1×":"1.5×","1.5×":"2×","2×":"1×"}; a.textContent = s[a.textContent]; break; }
    case "edit": startEdit(a.closest(".blk")); break;
    case "del": askDelete(a.closest(".blk")); break;
    case "week": S.week += +a.dataset.d; show("insights", {}, false); break;
    case "step": {
      const st = a.closest(".stepper2"), k = st.dataset.k, step = +st.dataset.step;
      S.settings[k] = Math.min(+st.dataset.max, Math.max(+st.dataset.min, S.settings[k] + step * +a.dataset.d));
      const unit = $(".u", st).textContent;
      $("output", st).innerHTML = `${S.settings[k]} <span class="u">${unit}</span>`;
      st.closest(".field").querySelector(".hint").innerHTML = hintFor(k, unit === "min" ? "minutes" : unit);
      refreshSave(); break;
    }
    case "seg": {
      const sg = a.closest(".seg"), k = sg.dataset.k;
      S.settings[k] = a.dataset.v; setPressed(a);
      const h = sg.closest(".field").querySelector(".hint"); if (k in DEFAULTS) h.innerHTML = hintFor(k);
      refreshSave(); break;
    }
    case "settoggle": S.settings[a.dataset.k] = a.checked; refreshSave(); break;
    case "libtoggle": toast(a.checked ? "On again; it comes at its hour" : "Off. Nothing is deleted"); break;
    case "save": S.saved = {...S.settings}; refreshSave(); toast("Saved"); break;
    case "discard": S.settings = {...S.saved}; show("settings", {}, true); break;
    case "ink": {
      S.ink = a.dataset.ink; S.params.ink = S.ink; applyLook();
      $$(".inkspec").forEach(b => b.setAttribute("aria-checked", String(b === a)));
      const gl = $("#glink"); if (gl) gl.textContent = $(".nm", a).textContent;
      const bl = $(".blot", a), r = a.getBoundingClientRect();
      bl.style.left = (e.clientX - r.left || r.width/2) + "px"; bl.style.top = (e.clientY - r.top || r.height/2) + "px";
      bl.classList.remove("go"); void bl.offsetWidth; bl.classList.add("go");
      break;
    }
    case "sjump": e.preventDefault(); $("#s-" + a.dataset.id).scrollIntoView({behavior: mm.matches ? "instant" : "smooth"}); break;
    case "toast": toast(a.dataset.msg); break;
    case "jump": { const day = "2026-10-" + String(a.dataset.day).padStart(2,"0"); const row = $(`.erow[data-stem^="${day}"]`); row && row.closest(".day").scrollIntoView({behavior: still() ? "instant" : "smooth", block:"start"}); break; }
    case "confirm-del": {
      const blk = a.closest(".blk"); S.deleted.add(blk.dataset.key);
      $$(":scope > *", blk).forEach(c => { c.style.transition = "opacity 260ms, transform 360ms"; c.style.opacity = 0; c.style.transform = "translateY(-6px)"; });
      setTimeout(() => blk.remove(), 360); toast("Deleted from the entry"); break;
    }
    case "keep-del": a.closest(".confirm").remove(); break;
    case "save-edit": {
      const blk = a.closest(".blk"), ta = $("textarea", blk);
      S.edited[blk.dataset.key] = ta.value; $(".his", blk).innerHTML = ta.value.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join("");
      $(".his", blk).style.display = ""; ta.parentElement.remove(); toast("Saved in your words"); break;
    }
    case "cancel-edit": { const blk = a.closest(".blk"); $(".his", blk).style.display = ""; a.closest(".editwrap").remove(); break; }
  }
});
function setPressed(btn){
  const sg = btn.closest(".seg");
  $$("button", sg).forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  placeThumbs(sg.parentElement);
}
function goTo(screen){
  if (screen === current) { window.scrollTo({top:0, behavior:"smooth"}); if (screen==="entries") return; }
  go(screen);
}
function startEdit(blk){
  if ($(".editwrap", blk)) return;
  blk.classList.remove("held");
  const his = $(".his", blk), text = [...his.querySelectorAll("p")].map(p => p.textContent).join("\n\n");
  const w = document.createElement("div"); w.className = "editwrap";
  w.innerHTML = `<textarea class="editbox his" rows="3" aria-label="Edit your words">${esc(text)}</textarea><div class="edit-acts"><button class="btn solid" data-act="save-edit" style="height:40px">Save</button><button class="btn quiet" data-act="cancel-edit" style="height:40px">Cancel</button><span class="hint" style="align-self:center">Only your words are editable. Hers never are.</span></div>`;
  his.style.display = "none"; his.after(w);
  const ta = $("textarea", w); ta.style.height = ta.scrollHeight + "px"; ta.focus();
}
function askDelete(blk){
  if ($(".confirm", blk)) return;
  blk.classList.remove("held");
  const c = document.createElement("div"); c.className = "confirm";
  c.innerHTML = `<span>Delete these words from the entry?</span><button class="btn line" data-act="confirm-del" style="height:40px">Delete</button><button class="btn quiet" data-act="keep-del" style="height:40px">Keep</button>`;
  $(".body", blk).appendChild(c);
}

/* long-press for block actions (touch) */
let lp = null;
document.addEventListener("pointerdown", e => {
  const blk = e.target.closest(".blk[data-key]");
  if (!blk || e.pointerType === "mouse" || e.target.closest("button,textarea,.player")) return;
  lp = setTimeout(() => { $$(".blk.held").forEach(b => b !== blk && b.classList.remove("held")); blk.classList.add("held"); navigator.vibrate && navigator.vibrate(8); }, 450);
});
["pointerup","pointercancel","pointermove"].forEach(t => document.addEventListener(t, e => { if (t !== "pointermove" || Math.abs(e.movementY) > 4) clearTimeout(lp); }));
document.addEventListener("contextmenu", e => { if (e.target.closest(".blk[data-key]") && phone()) e.preventDefault(); });

/* seek on the waveform */
document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".wave"); if (!w) return;
  const pl = w.closest(".player"), r = w.getBoundingClientRect();
  paint(pl, Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * +pl.dataset.dur);
});
document.addEventListener("keydown", e => {
  const w = e.target.closest && e.target.closest(".wave");
  if (w && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ const pl = w.closest(".player"); paint(pl, Math.max(0, Math.min(+pl.dataset.dur, +(pl.dataset.t||0) + (e.key==="ArrowRight"?5:-5)))); e.preventDefault(); }
  if (e.key === "Escape"){
    if (openPop) return closePop();
    const room = $("#room");
    if (S.room.open && room.classList.contains("focus")){ room.classList.remove("focus"); return; }
    if (S.room.open) return closeRoom();
    if (current === "entry") return go("entries");
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "." && S.room.open){ $("#room").classList.toggle("focus"); e.preventDefault(); }
  if (e.key === "g" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey) $(".gridlines").classList.toggle("show");
});
$("#rtext").addEventListener("input", countWords);
window.addEventListener("resize", () => { buildGrid(); placeThumbs(); });

/* ---------------------------------------------------------------- boot */
const sysDark = window.matchMedia("(prefers-color-scheme: dark)");
S.theme = sysDark.matches ? "dark" : "light";
S.tod = todFromClock();
if (S.theme === "light" && S.tod === "night") S.tod = "dusk";
sysDark.addEventListener("change", ev => { if (!S.params.theme){ S.theme = ev.matches ? "dark" : "light"; applyLook(); } });
buildGrid();
route(true);
})();
</script>

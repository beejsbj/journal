<!doctype html>
<html lang="en" data-theme="dark" data-ink="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>journal · Night Room (direction B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..650;1,6..72,300..650&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Night Room · tokens
   ===================================================================== */
@property --ink { syntax: '<color>'; inherits: true; initial-value: #a9bdf5; }

:root {
  --f-serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --f-sans: 'Geist', 'Hanken Grotesk', ui-sans-serif, sans-serif;

  /* night (default) */
  --room: #0a0d12;
  --ground: #0f131a;
  --pane: #141921;
  --raised: #1a2029;
  --raised-2: #222935;
  --hair: rgba(196, 210, 235, .075);
  --hair-2: rgba(196, 210, 235, .13);
  --text: #ebe8e1;          /* his words: warm paper-white */
  --text-2: #a9afba;
  --text-3: #8a91a0;        /* AA (>=4.5) on --pane and --raised */
  --lamp: #f1ede4;          /* his actions: the lamp */
  --on-lamp: #12161d;
  --glow: rgba(255, 238, 206, .055);
  --scrim: rgba(5, 7, 10, .55);
  --blur-bg: rgba(20, 25, 33, .72);
  --elev-1: inset 0 1px 0 rgba(255,255,255,.035), 0 12px 32px -16px rgba(0,0,0,.7);
  --elev-2: inset 0 1px 0 rgba(255,255,255,.045), 0 30px 70px -24px rgba(0,0,0,.8), 0 2px 10px rgba(0,0,0,.35);
  --elev-pop: inset 0 1px 0 rgba(255,255,255,.06), 0 20px 50px -12px rgba(0,0,0,.75), 0 0 0 1px var(--hair-2);
  --ink-glow-k: 38%;

  --r-s: 8px; --r-m: 12px; --r-l: 18px; --r-xl: 26px;

  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
  --d-fast: 160ms; --d-mid: 280ms; --d-slow: 520ms;
  /* --spring, --spring-soft and their durations are generated from a damped spring at boot (see springLinear) */
  --spring: var(--ease-out); --spring-dur: 480ms;
  --spring-soft: var(--ease-out); --spring-soft-dur: 600ms;

  --app-h: 100dvh;
  transition: --ink .6s var(--ease-out);
  color-scheme: dark;
}
:root[data-theme="light"] {
  /* morning */
  --room: #e7e6e1;
  --ground: #efeee9;
  --pane: #faf9f6;
  --raised: #ffffff;
  --raised-2: #f2f1ec;
  --hair: rgba(24, 28, 38, .085);
  --hair-2: rgba(24, 28, 38, .14);
  --text: #1a1d23;
  --text-2: #565c67;
  --text-3: #5c626c;        /* AA on every morning ground, the room included */
  --lamp: #1b1f27;
  --on-lamp: #f7f5ef;
  --glow: rgba(255, 226, 170, .32);
  --scrim: rgba(30, 32, 38, .28);
  --blur-bg: rgba(250, 249, 246, .78);
  --elev-1: 0 1px 2px rgba(24,28,38,.05), 0 14px 34px -18px rgba(24,28,38,.18);
  --elev-2: 0 1px 2px rgba(24,28,38,.06), 0 30px 60px -26px rgba(24,28,38,.26);
  --elev-pop: 0 18px 44px -14px rgba(24,28,38,.28), 0 0 0 1px var(--hair-2);
  --ink-glow-k: 0%;
  color-scheme: light;
}
/* her four inks, tuned per ground; all >= 7:1 on --pane in both themes */
:root[data-ink="blue"]   { --ink: #aec0f4; }
:root[data-ink="brown"]  { --ink: #e2b893; }
:root[data-ink="violet"] { --ink: #cdb4f3; }
:root[data-ink="green"]  { --ink: #98d3ae; }
:root[data-theme="light"][data-ink="blue"]   { --ink: #26387a; }
:root[data-theme="light"][data-ink="brown"]  { --ink: #74431f; }
:root[data-theme="light"][data-ink="violet"] { --ink: #573690; }
:root[data-theme="light"][data-ink="green"]  { --ink: #255c40; }
:root {
  --ink-wash: color-mix(in oklab, var(--ink) 9%, transparent);
  --ink-line: color-mix(in oklab, var(--ink) 50%, transparent);
  --ink-glow: color-mix(in oklab, var(--ink) var(--ink-glow-k), transparent);
}

/* =====================================================================
   base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: var(--app-h); background: var(--room); color: var(--text); overflow: hidden; }
body { font: 400 15px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "ss01", "cv11"; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
#app { height: var(--app-h); }

/* the two voices --------------------------------------------------------*/
.his { font-family: var(--f-serif); font-optical-sizing: auto; color: var(--text); }
.her { font-family: var(--f-serif); font-style: italic; font-weight: 380; color: var(--ink); font-optical-sizing: auto; }
.her-name { font: 500 12.5px/1 var(--f-sans); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
.her-name .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 10px var(--ink-glow); }
.her-name .t { color: var(--text-3); font-weight: 400; }
.stroke { position: relative; padding-left: 20px; }
.stroke::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 12px var(--ink-glow); }

/* buttons: his actions are lamp/neutral, never her ink -----------------*/
.btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 500; font-size: 14.5px; transition: transform var(--d-fast) var(--ease-out), background var(--d-mid), box-shadow var(--d-mid); }
.btn:active { transform: scale(.97); }
.btn-lamp { background: var(--lamp); color: var(--on-lamp); box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 8px 24px -10px color-mix(in oklab, var(--lamp) 45%, transparent); }
.btn-quiet { color: var(--text-2); }
.btn-quiet:hover { color: var(--text); background: var(--raised); }
.btn-line { box-shadow: inset 0 0 0 1px var(--hair-2); color: var(--text); }
.btn-line:hover { background: var(--raised); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--text-2); transition: background var(--d-fast), color var(--d-fast); position: relative; }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn::after { content: ""; position: absolute; inset: -2px; } /* 44px hit area */
.link { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 3px; }
.link:hover { color: var(--text); }

/* =====================================================================
   desktop shell: rail + floating panes
   ===================================================================== */
.desk { display: grid; grid-template-columns: auto minmax(0, 1fr); height: var(--app-h); }
.rail { width: 212px; padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 2px; view-transition-name: rail; overflow: hidden; }
.rail.compact { width: 68px; padding-inline: 12px; }
.mark-row { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; margin-bottom: 14px; }
.lampmark { width: 20px; height: 20px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--lamp) 0 28%, transparent 30%), radial-gradient(circle, color-mix(in oklab, var(--lamp) 22%, transparent) 0 55%, transparent 72%); }
.wordmark { font: 600 16px/1 var(--f-sans); letter-spacing: -.01em; }
.rail .write { justify-content: flex-start; width: 100%; margin-bottom: 14px; padding: 0 14px; }
.rail .write .kbd { margin-left: auto; font-size: 11.5px; opacity: .55; font-weight: 500; }
.rail.compact .write { width: 44px; padding: 0; justify-content: center; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 11px; color: var(--text-2); font-weight: 500; font-size: 14.5px; white-space: nowrap; transition: background var(--d-fast), color var(--d-fast); }
.nav-i:hover { color: var(--text); background: color-mix(in oklab, var(--raised) 70%, transparent); }
.nav-i.on { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
.rail.compact .nav-i { padding: 0; justify-content: center; width: 44px; }
.rail.compact .lbl, .rail.compact .wordmark, .rail.compact .kbd, .rail.compact .rail-foot .seg { display: none; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.theme-seg { display: flex; padding: 3px; border-radius: 12px; background: var(--ground); box-shadow: inset 0 0 0 1px var(--hair); }
.theme-seg button { flex: 1; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-3); }
.theme-seg button.on { background: var(--raised); color: var(--text); box-shadow: var(--elev-1); }
.rail.compact .theme-seg { flex-direction: column; width: 44px; }

.stage { display: flex; gap: 10px; padding: 10px 10px 10px 0; min-width: 0; height: var(--app-h); }
.pane { position: relative; background: var(--pane); border-radius: var(--r-l); box-shadow: var(--elev-1); outline: 1px solid var(--hair); outline-offset: -1px; min-width: 0; }
.scroller { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; }
.main-pane { flex: 1; }
.side-pane { width: 92px; flex: none; background: var(--ground); box-shadow: none; }
.entry-pane { flex: 1; box-shadow: var(--elev-2); }
.lamp-light { position: absolute; inset: 0 0 auto 0; height: 380px; pointer-events: none; background: radial-gradient(ellipse 55% 100% at 50% 0%, var(--glow), transparent 75%); border-radius: inherit; }

@media (min-width: 761px) {
  .vt-page { view-transition-name: page; }
  .vt-entry { view-transition-name: entrypane; }
  .vt-title { view-transition-name: entry-title; }
}

/* =====================================================================
   phone shell
   ===================================================================== */
.phone { height: var(--app-h); position: relative; background: var(--pane); }
.phone > .scroller { height: 100%; padding-bottom: 120px; }
.tabbar { position: absolute; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); height: 66px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 6px; border-radius: 24px; background: var(--blur-bg); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: var(--elev-pop); view-transition-name: tabbar; z-index: 20; }
.tab { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-3); font-size: 10.5px; font-weight: 500; border-radius: 16px; }
.tab.on { color: var(--text); }
.tab .i { width: 21px; height: 21px; }
.tab-write { justify-self: center; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--lamp); color: var(--on-lamp); box-shadow: 0 0 0 5px color-mix(in oklab, var(--lamp) 8%, transparent), 0 10px 26px -8px color-mix(in oklab, var(--lamp) 50%, transparent); }
.tab-write .i { width: 22px; height: 22px; }
.ph-top { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 6px 8px 0 12px; }
.ph-back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 4px; color: var(--text-2); font-weight: 500; }

/* =====================================================================
   page furniture
   ===================================================================== */
.page { padding: 34px 48px 80px; max-width: 880px; margin: 0 auto; position: relative; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
.kicker { font-size: 13px; color: var(--text-3); font-weight: 450; margin-bottom: 6px; }
.title { font: 600 30px/1.1 var(--f-sans); letter-spacing: -.022em; }
.sub { font-size: 14.5px; color: var(--text-2); margin-top: 8px; max-width: 52ch; }
.section-label { font: 500 13px/1 var(--f-sans); color: var(--text-2); display: flex; align-items: center; gap: 12px; }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.section-label .aside { order: 2; color: var(--text-3); font-weight: 400; }
@media (max-width: 760px) {
  .page { padding: 4px 20px 40px; }
  .page-head { margin-bottom: 18px; }
  .title { font-size: 30px; }
  .day { grid-template-columns: 50px minmax(0, 1fr); }
  .dnum { font-size: 27px; }
  .row-first { font-size: 17.5px; }
  .ph-top { height: 44px; }
}

/* rise-in for re-rendered lists */
.rise { animation: rise var(--d-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* =====================================================================
   entries
   ===================================================================== */
.lens { font-size: 15px; color: var(--text-2); line-height: 1.9; }
.lens-term { position: relative; display: inline-block; }
.lens-term > button { color: var(--text); font-weight: 500; border-bottom: 1px dashed var(--hair-2); padding: 0 1px; line-height: 1.3; transition: border-color var(--d-fast); }
.lens-term > button:hover, .lens-term.open > button { border-bottom-color: var(--text-2); }
.lens-term > button .i { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; opacity: .6; transition: transform var(--d-mid) var(--ease-out); }
.lens-term.open > button .i { transform: rotate(180deg); }
.lens .clear { margin-left: 8px; font-size: 13.5px; }
.pop { position: absolute; top: calc(100% + 8px); left: -10px; z-index: 30; min-width: 230px; padding: 6px; border-radius: 14px; background: var(--blur-bg); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); box-shadow: var(--elev-pop); transform-origin: 20px 0; animation: popIn 300ms var(--spring) both; line-height: 1.4; }
@keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(-4px); } }
.pop button { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 9px; color: var(--text-2); text-align: left; font-size: 14.5px; }
.pop button:hover { background: var(--raised-2); color: var(--text); }
.pop button.on { color: var(--text); }
.pop button .i { margin-left: auto; width: 16px; height: 16px; }
.pop .cnt { margin-left: auto; color: var(--text-3); font-size: 12.5px; }
.pop button.on .cnt { display: none; }
.search { display: flex; align-items: center; gap: 10px; height: 44px; width: 260px; padding: 0 14px; border-radius: 14px; background: var(--ground); box-shadow: inset 0 0 0 1px var(--hair); color: var(--text-3); transition: box-shadow var(--d-mid), width var(--d-slow) var(--ease-out); }
.search:focus-within { box-shadow: inset 0 0 0 1px var(--hair-2), 0 0 0 4px var(--hair); width: 300px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 15px var(--f-serif); }
.search input::placeholder { color: var(--text-3); font-family: var(--f-sans); font-size: 14px; }

.waiting { position: relative; margin: 26px 0 34px; padding: 22px 24px 18px; border-radius: var(--r-l); background: var(--raised); box-shadow: var(--elev-1); outline: 1px solid var(--hair); outline-offset: -1px; overflow: hidden; }
.waiting::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 50% 90% at 0% 0%, var(--ink-wash), transparent 70%); pointer-events: none; }
.waiting .w-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.waiting .w-state { font-size: 13px; color: var(--text-3); }
.waiting .her.opener { font-size: 19px; line-height: 1.5; max-width: 56ch; }
.waiting .q { margin-top: 10px; font-size: 16.5px; }
.waiting .w-act { display: flex; gap: 6px; align-items: center; margin-top: 18px; }

.week { margin-top: 30px; }
.week:first-of-type { margin-top: 8px; }
.day { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px; padding: 14px 0 6px; border-bottom: 1px solid var(--hair); }
.day:last-child { border-bottom: 0; }
.day-mark { padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
.dnum { font: 300 30px/0.9 var(--f-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dname { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.row { display: block; padding: 12px 14px 13px; margin: 0 -14px 2px -14px; border-radius: 14px; transition: background var(--d-fast); cursor: pointer; }
.row:hover { background: var(--raised); }
.row-top { display: flex; align-items: center; gap: 10px; }
.row-title { font-weight: 550; font-size: 14.5px; letter-spacing: -.003em; }
.row-title .sess { color: var(--text-3); font-weight: 450; }
.row-ind { display: inline-flex; gap: 8px; align-items: center; color: var(--text-3); }
.row-ind .i { width: 15px; height: 15px; }
.row-ind .inkdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 8px var(--ink-glow); }
.row-time { margin-left: auto; color: var(--text-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.row-first { margin-top: 4px; font-size: 18px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.kind-j .row-first { font-size: 17px; color: var(--text-2); }
.empty-lens { padding: 50px 0; color: var(--text-3); }
.empty-lens .his { font-size: 20px; color: var(--text-2); margin-bottom: 6px; }

/* side dots (entry open on desktop) */
.dots { display: flex; flex-direction: column; align-items: center; padding: 14px 0 30px; gap: 4px; }
.dots .back { margin-bottom: 10px; }
.dwk { font-size: 11px; color: var(--text-3); margin: 14px 0 4px; font-weight: 500; text-align: center; line-height: 1.2; }
.dday { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; width: 68px; border-radius: 12px; }
.dday .dd-n { font: 400 16px/1 var(--f-sans); font-variant-numeric: tabular-nums; color: var(--text-2); }
.dday .dd-w { font-size: 10.5px; color: var(--text-3); }
.dday.on .dd-n { color: var(--text); font-weight: 550; }
.dd-dots { display: flex; gap: 2px; margin-top: 2px; }
.dot { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); transition: transform var(--d-mid) var(--spring), background var(--d-fast); }
.dot:hover::before { transform: scale(1.35); background: var(--text-2); }
.dot.on::before { background: var(--lamp); box-shadow: 0 0 0 3px color-mix(in oklab, var(--lamp) 18%, transparent); }
#tip { position: fixed; z-index: 60; pointer-events: none; max-width: 260px; padding: 10px 12px; border-radius: 12px; background: var(--blur-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--elev-pop); opacity: 0; transform: translateX(-4px); transition: opacity var(--d-fast), transform var(--d-mid) var(--ease-out); }
#tip.on { opacity: 1; transform: none; }
#tip .t1 { font-size: 12.5px; color: var(--text-3); }
#tip .t2 { font: 15px/1.4 var(--f-serif); margin-top: 3px; }

/* =====================================================================
   entry document
   ===================================================================== */
.doc { position: relative; padding: 40px 56px 120px; }
.doc-head { display: grid; grid-template-columns: 72px minmax(0, 1fr) 220px; column-gap: 28px; margin-bottom: 34px; }
.doc-head .hd { grid-column: 2; }
.doc-head .acts { grid-column: 3; display: flex; justify-content: flex-end; gap: 2px; align-self: start; }
.doc-title { font: 600 34px/1.1 var(--f-sans); letter-spacing: -.025em; width: fit-content; }
.doc-meta { margin-top: 10px; font-size: 14px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.doc-meta b { font-weight: 500; color: var(--text-2); }
.grid3 { display: grid; grid-template-columns: 72px minmax(0, 1fr) 220px; column-gap: 28px; }
.grid3 > .c2 { grid-column: 2; min-width: 0; }
.grid3 > .c3 { grid-column: 3; }
.grid3 > .c1 { grid-column: 1; text-align: right; }

.prompt-block { margin-bottom: 40px; }
.grid3 > .c2.stroke { margin-left: -20px; }
@media (max-width: 760px) { .grid3 > .c2.stroke { margin-left: 0; } .room .her-prompt { margin-left: 0; } }
.prompt-block .opener { font-size: 21px; line-height: 1.5; margin-top: 12px; }
.prompt-block .answer-in { margin-top: 14px; }
.qs { margin-top: 16px; }
.qs-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; text-align: left; border-radius: 12px; padding: 0 12px 0 0; }
.qs-head .her { font-size: 17px; }
.qs-head .count { font-size: 13px; color: var(--text-3); white-space: nowrap; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.qs-cols { columns: 2; column-gap: 36px; padding: 12px 0 6px; }
.qsec { break-inside: avoid; margin-bottom: 18px; }
.qsec-h { font-size: 12.5px; color: var(--text-3); font-weight: 500; margin-bottom: 6px; }
.qsec ol { list-style: none; margin: 0; padding: 0; }

/* =====================================================================

   ===================================================================== */

.room-top .ctx { font-size: 13.5px; color: var(--text-3); text-align: center; white-space: nowrap; }
.room-top .ctx b { color: var(--text-2); font-weight: 500; }
.room-top .r { justify-self: end; display: flex; gap: 4px; align-items: center; }

.saved.saving .sd { background: var(--text-2); animation: pulse 1s ease-in-out infinite; }

.room .her-prompt { margin-bottom: 40px; margin-left: -20px; }
.room .her-prompt .opener { font-size: 20px; line-height: 1.5; margin-top: 10px; }
.room .her-prompt .q { font-size: 22px; line-height: 1.45; margin-top: 14px; }
.room .her-prompt .q-nav { display: flex; gap: 4px; margin-top: 10px; margin-left: -10px; }
.room .her-prompt .q-nav button { font-size: 13px; color: var(--text-3); height: 36px; padding: 0 10px; border-radius: 10px; }
.room .her-prompt .q-nav button:hover { background: var(--raised); color: var(--text); }
.ed { font: 24px/1.66 var(--f-serif); letter-spacing: -.004em; outline: 0; min-height: 40vh; caret-color: var(--text); color: var(--text); }

.ed .vchip { display: inline-flex; align-items: center; gap: 10px; font: 500 13.5px var(--f-sans); color: var(--text-2); padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair-2); }
.ed .vchip .i { width: 16px; height: 16px; }
.dock { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; width: min(700px, calc(100% - 24px)); padding: 10px 10px 10px 22px; border-radius: 30px; background: var(--blur-bg); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: var(--elev-pop); }
.dock .count { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.dock .r { justify-self: end; }
.orb-wrap { position: relative; display: grid; place-items: center; width: 60px; height: 60px; }
.orb { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: radial-gradient(circle at 50% 35%, var(--raised-2), var(--raised)); box-shadow: inset 0 0 0 1px var(--hair-2), 0 6px 18px -8px rgba(0,0,0,.6); transition: transform var(--spring-dur) var(--spring), background var(--d-mid), color var(--d-mid); }
.orb:hover { transform: scale(1.05); }

.orb-wrap .ring { position: absolute; inset: 4px; border-radius: 50%; background: color-mix(in oklab, var(--lamp) 14%, transparent); opacity: 0; transform: scale(1); }
.orb-wrap.rec .orb { background: var(--lamp); color: var(--on-lamp); animation: breathe 3.2s ease-in-out infinite; }
.orb-wrap.rec .ring { opacity: 1; transform: scale(calc(1.15 + var(--lvl, 0) * .55)); transition: transform 120ms linear; }

.rec-time { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .room-top { padding: 0 6px; height: 56px; }

  .room-top { grid-template-columns: auto 1fr; }

/* =====================================================================
   insights
   ===================================================================== */
.ins { padding: 34px 48px 90px; max-width: 1120px; margin: 0 auto; position: relative; }

.lede { font: 300 34px/1.28 var(--f-sans); letter-spacing: -.022em; color: var(--text-2); max-width: 22em; text-wrap: pretty; }

.review .rest { font-size: 18px; line-height: 1.6; margin-top: 18px; }

.review .threads { margin-top: 6px; }
.review .ask { margin-top: 20px; padding: 16px 0 0; border-top: 1px solid var(--hair); }
.review .ask .k { font: 500 12.5px var(--f-sans); color: var(--text-3); margin-bottom: 6px; }

@media (max-width: 1100px) and (min-width: 761px) { .ins-grid { grid-template-columns: 1fr; } }
@media (max-width: 760px) {

  .review { order: 2; }
  .when { order: 3; margin-top: 0; }

  .prog-row { grid-template-columns: 1fr; }

/* =====================================================================
   library
   ===================================================================== */

@media (max-width: 760px) {
  .lib-row { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; }
  .lib-row .chev { display: none; }
  .lib-detail { padding-left: 0; }

}

/* =====================================================================
   settings
   ===================================================================== */

/* ---- springs: a damped spring sampled into CSS linear() ---------------- */
function springLinear(stiffness, damping, mass = 1) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = (t) => 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  let T = 0;
  for (let t = 0; t < 4; t += 1 / 120) if (Math.abs(1 - x(t)) > 0.0015) T = t;
  T += 1 / 60;
  const pts = [];
  for (let i = 0; i <= 48; i++) pts.push(i === 48 ? 1 : +x((T * i) / 48).toFixed(4));
  return { ease: `linear(${pts.join(', ')})`, dur: Math.round(T * 1000) };

function constellation() {

  const W = isPhone() ? 350 : 640, x0 = isPhone() ? 36 : 44, x1 = W - 12, rowH = isPhone() ? 28 : 30, top = 10;
  const X = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return x0 + ((h + m / 60) / 24) * (x1 - x0); };
  const H = top + rowH * 7 + 22;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="When you wrote, by day and hour">`;
  s += `<rect x="${x0}" y="${top - 4}" width="${X('06:00') - x0}" height="${rowH * 7 + 4}" rx="6" fill="var(--hair)"/>`;
  s += `<rect x="${X('21:00')}" y="${top - 4}" width="${x1 - X('21:00')}" height="${rowH * 7 + 4}" rx="6" fill="var(--hair)"/>`;
  days.forEach((d, i) => {
    const y = top + i * rowH + rowH / 2;
    s += `<text x="0" y="${y + 4}">${d}</text><line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--hair-2)" stroke-width="1"/>`;
    if (WEEK.reflections.some((r) => r.date === dates[i])) s += `<circle cx="${X('04:00') + (x1 - x0) / 24 * 24 - (x1 - x0) + (x1 - x0)}" cy="${y}" r="0" />`;
    ENTRIES.filter((e) => e.date === dates[i]).forEach((e) => {
      const r = 3 + Math.sqrt(e.words) / 3.4;
      s += `<circle cx="${X(e.time).toFixed(1)}" cy="${y}" r="${r.toFixed(1)}" fill="var(--text)" fill-opacity=".9"><title>${PR[e.kind].title}, ${e.time} · ${e.words} words</title></circle>`;
    });
    const refl = WEEK.reflections.find((r) => r.date === dates[i]);
    if (refl && i < 6) { const yy = top + (i + 1) * rowH + rowH / 2; s += `<circle cx="${X('04:00')}" cy="${yy}" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.5"><title>Ada's reflection on ${d}</title></circle>`; }
  });

}

  const [h, m] = it.at.split(':').map(Number); const a = (((h % 12) + m / 60) / 12) * 2 * Math.PI - Math.PI / 2;

  const act = a.act;
  switch (act) {
    case 'write': S.prevRoute = S.route === 'entry' ? 'entry' : S.route; openWrite('new', t); break;
    case 'write-prompt': S.prevRoute = S.route; openWrite('prompt', t); break;
    case 'write-prompt-voice': S.prevRoute = S.route; openWrite('prompt', t, { startRec: true }); break;
    case 'write-entry': S.prevRoute = 'entry'; openWrite('entry', t); break;
    case 'write-entry-voice': S.prevRoute = 'entry'; openWrite('entry', t, { startRec: true }); break;
    case 'close-room': closeRoom(); break;
    case 'add': closeRoom(S.write.from === 'new' ? 'Kept as a note' : S.write.from === 'prompt' ? 'Saved to Morning journal' : 'Added to the entry'); break;
    case 'focus': S.focus = !S.focus; t.classList.toggle('on', S.focus); t.setAttribute('aria-pressed', S.focus); $('.ed')?.classList.toggle('focus', S.focus); break;
    case 'rec': toggleRec(); break;
    case 'q-next': { S.qi = ((S.qi || 0) + 1) % MORNING_Q.length; const q = $('[data-q-text]'); q.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 160, easing: 'ease-in' }).onfinish = () => { q.textContent = MORNING_Q[S.qi]; q.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.16,1,.3,1)' }); }; break; }
    case 'q-all': { const q = $('[data-q-text]'); q.innerHTML = MORNING_Q.map((x) => esc(x)).join('<br>'); q.style.fontSize = '18px'; q.style.lineHeight = '1.7'; t.remove(); break; }
    case 'back-list': go({ route: 'entries' }, 'close'); break;
    case 'lens-clear': S.lens = { practice: 'all', voice: 'any', open: null }; S.q = ''; transition('fade', render); break;
    case 'disc': { const d = t.closest('[data-open]'); const o = d.dataset.open !== 'true'; d.dataset.open = o; t.setAttribute('aria-expanded', o); break; }
    case 'disc-review': { const d = t.closest('.disc'); const o = d.dataset.open !== 'true'; d.dataset.open = o; t.firstChild.textContent = o ? 'Fold the review' : 'Read the whole review'; break; }
    case 'her-fold': t.setAttribute('aria-expanded', t.getAttribute('aria-expanded') !== 'true'); break;
    case 'lib': if (ev.target.closest('.tog,.btn')) break; { const it = t.closest('.lib-item'); const o = it.dataset.open !== 'true'; it.dataset.open = o; S.libOpen[a.id] = o; t.setAttribute('aria-expanded', o); } break;
    case 'lib-tog': ev.stopPropagation(); { const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); t.closest('.lib-row').querySelector('div[style]')?.style.setProperty('opacity', on ? '1' : '.55'); } break;
    case 'continue': ev.stopPropagation(); toast('The run screen is out of this round'); break;
    case 'toggle-theme': S.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; history.replaceState(history.state, '', hashFor()); transition('fade', render); break;
    case 'set-home': go({ group: null }, 'pop'); break;
    case 'save': S.saved = { ...S.settings }; toast(`Saved`); break;
    case 'discard': S.settings = { ...S.saved }; render(); break;
    case 'play': playToggle(t.closest('.audio')); break;
    case 'rate': { const r = ['1×', '1.25×', '1.5×', '0.75×']; t.textContent = r[(r.indexOf(t.textContent) + 1) % r.length]; break; }
    case 'seek': { const au = t.closest('.audio'); const r = t.getBoundingClientRect(); setPos(au, ((ev.clientX - r.left) / r.width) * +au.dataset.dur); break; }
    case 'edit': startEdit(t.closest('.his-block')); break;
    case 'copy': navigator.clipboard?.writeText(t.closest('.his-block').querySelector('.b-text').innerText).catch(() => {}); toast('Copied'); break;
    case 'del': askDelete(t.closest('.his-block')); break;
    case 'del-yes': removeBlock(t.closest('.his-block')); break;
    case 'del-no': restoreTools(t.closest('.his-block')); break;
    case 'meta': toast('The meta sheet is out of this round'); break;
    case 'wk-prev': toast('Earlier weeks: a quiet week reads “Nothing written”'); break;
    case 'sheet-close': closeSheet(); break;
    case 'sheet-edit': { const b = sheetBlock; closeSheet(); startEdit(b); break; }
    case 'sheet-copy': closeSheet(); toast('Copied'); break;
    case 'sheet-del': { const b = sheetBlock; closeSheet(); removeBlock(b); break; }
  }
});
document.addEventListener('input', (ev) => {
  const q = ev.target.closest('[data-q]'); if (q) { S.q = q.value; const pos = q.selectionStart; render(); const n = $('[data-q]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  const tx = ev.target.closest('[data-text]'); if (tx) { S.settings[tx.dataset.text] = tx.value; const bar = $('.savebar'); if (!bar && changes().length) { const pos = tx.selectionStart; render(); const n = $(`[data-text="${tx.dataset.text}"]`); n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if (S.route === 'write') closeRoom(); else if (S.lens.open) { S.lens.open = null; render(); } else if (sheetBlock) closeSheet(); else if (S.route === 'entry') go({ route: 'entries' }, 'close'); }
  if ((ev.key === 'n' || ev.key === 'N') && S.route !== 'write' && !ev.target.closest('input,textarea,[contenteditable="true"]') && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); S.prevRoute = S.route; openWrite('new', $('[data-act="write"]')); }
  if (ev.key === 'Enter' && ev.target.matches('.lib-row')) ev.target.click();
});

/* audio */
const playing = new Map();
function setPos(au, s) {
  const dur = +au.dataset.dur; s = Math.max(0, Math.min(dur, s)); au.dataset.pos = s;
  const bars = $$('.wave i', au); const k = Math.round((s / dur) * bars.length);
  bars.forEach((b, i) => b.classList.toggle('done', i < k));
  $('.pos', au).textContent = fmtDur(s); $('.wave', au).setAttribute('aria-valuenow', Math.round(s));
}
function playToggle(au) {
  const btn = $('.play', au);
  if (playing.has(au)) { cancelAnimationFrame(playing.get(au)); playing.delete(au); btn.innerHTML = playIc; btn.setAttribute('aria-label', 'Play voice note'); return; }
  btn.innerHTML = pauseIc; btn.setAttribute('aria-label', 'Pause');
  let last = performance.now();
  const step = (now) => { const rate = parseFloat($('.rate', au).textContent) || 1; setPos(au, +au.dataset.pos + ((now - last) / 1000) * rate * 6); last = now; if (+au.dataset.pos >= +au.dataset.dur) { playToggle(au); setPos(au, 0); return; } playing.set(au, requestAnimationFrame(step)); };
  playing.set(au, requestAnimationFrame(step));
}

/* block actions */
function startEdit(block) {
  if (!block) return;
  const tx = $('.b-text', block); const before = tx.innerHTML;
  tx.contentEditable = 'true'; tx.focus();
  block.querySelector('.b-tools').style.display = 'none';
  tx.insertAdjacentHTML('afterend', `<div class="edit-bar"><button class="btn btn-lamp" data-act="edit-save">Save</button><button class="btn btn-quiet" data-act="edit-cancel">Cancel</button><span class="note">Only this passage changes; ${VOICES.hers}’s words stay as they are.</span></div>`);
  const bar = $('.edit-bar', block);
  bar.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b) return; e.stopPropagation(); if (b.dataset.act === 'edit-cancel') tx.innerHTML = before; tx.contentEditable = 'false'; bar.remove(); block.querySelector('.b-tools').style.display = ''; if (b.dataset.act === 'edit-save') toast('Saved'); });
}
function askDelete(block) {
  const tools = $('.b-tools', block); tools.dataset.html = tools.innerHTML;
  tools.innerHTML = `<span class="b-confirm">Delete this passage?<button class="btn btn-quiet" style="height:36px" data-act="del-no">Keep</button><button class="btn btn-lamp" style="height:36px" data-act="del-yes">Delete</button></span>`;
  tools.style.opacity = 1; tools.style.pointerEvents = 'auto'; tools.style.transform = 'none'; tools.style.flexDirection = 'row'; tools.style.right = 'auto'; tools.style.left = '-12px'; tools.style.top = 'auto'; tools.style.bottom = '-30px';
}
function restoreTools(block) { const tools = $('.b-tools', block); tools.innerHTML = tools.dataset.html; tools.style.cssText = ''; }
function removeBlock(block) { if (!block) return; block.style.maxHeight = block.offsetHeight + 'px'; block.classList.add('leaving'); setTimeout(() => block.remove(), 430); }

/* long-press on phone */
let pressT, sheetBlock = null;
document.addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest('.his-block'); if (!b || !isPhone() || ev.target.closest('.audio,.edit-bar,[contenteditable="true"]')) return;
  b.classList.add('pressing');
  pressT = setTimeout(() => { b.classList.remove('pressing'); openSheet(b); }, 480);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((e) => document.addEventListener(e, () => { clearTimeout(pressT); $$('.pressing').forEach((x) => x.classList.remove('pressing')); }, true));
document.addEventListener('scroll', () => { clearTimeout(pressT); }, true);
function openSheet(b) {
  sheetBlock = b; navigator.vibrate?.(8);
  const time = $('.b-meta', b).textContent.replace('voice', ' · voice');
  document.body.insertAdjacentHTML('beforeend', `<div class="scrim" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-label="This passage"><div class="sh-h">Your words · ${esc(time)}<span class="his">${esc($('.b-text', b).innerText)}</span></div>
    <button class="it" data-act="sheet-edit">${ic('pen')}Edit</button><button class="it" data-act="sheet-copy">${ic('copy')}Copy</button><button class="it" data-act="sheet-del">${ic('trash')}Delete</button></div>`);
}
function closeSheet() { sheetBlock = null; $$('.scrim,.sheet').forEach((x) => x.remove()); }

/* dot tooltips */
document.addEventListener('pointerover', (ev) => {
  const d = ev.target.closest('.dot[data-tip]'); const tip = $('#tip');
  if (!d) { tip.classList.remove('on'); return; }
  const r = d.getBoundingClientRect();
  $('.t1', tip).textContent = d.dataset.tip; $('.t2', tip).textContent = d.dataset.tip2;
  tip.style.left = r.right + 12 + 'px'; tip.style.top = Math.max(8, r.top - 10) + 'px'; tip.classList.add('on');
});

/* boot */
mqDark.addEventListener('change', () => { if (!S.theme) render(); });
mqPhone.addEventListener('change', () => { if (S.route === 'settings' && !isPhone() && !S.group) S.group = 'ink'; render(); });
stateFromHash(window.__HASH || location.hash);
if (window.__NOFOCUS) S.noAutofocus = true;
history.replaceState({}, '', window.__HASH ? location.pathname : (location.hash ? location.href : hashFor()));
render();
</script>
</body>
